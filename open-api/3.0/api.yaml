            - `delegation-unknown-core`: The requested target core is unknown to this platform.
          x-pryv-error-ids:
            - delegation-unknown-username
            - delegation-self-not-allowed
            - delegation-unknown-core
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: |-
            Specific errors:

            - `delegation-username-taken`: The requested username is already taken.
          x-pryv-error-ids:
            - delegation-username-taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "502":
          description: |-
            Specific errors:

            - `delegation-creation-failed`: The target core could not create the account.
          x-pryv-error-ids:
            - delegation-creation-failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
