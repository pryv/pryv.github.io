        - streams.update
      description: |-
        Modifies the stream.

        Moving a stream (a new `parentId`) by an access other than a personal one needs a `manage` permission on the stream, on every stream below it (trashed ones included), and on the new parent stream (or on `*` to move it to the root); otherwise the call answers `403 forbidden` and nothing moves. The new parent cannot be the stream itself or one of its descendants (`400 invalid-operation`).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            allOf:
              - $ref: "#/components/schemas/identifier"
          description: The id of the stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/stream"
              description: "New values for the stream's fields: see [stream](https://pryv.github.io/reference/#data-structure-stream). All fields are optional, and only modified values must be included."
            examples:
              renaming-a-stream:
                value:
                  name: Slothing
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream:
                    allOf:
                      - $ref: "#/components/schemas/stream"
                    description: The updated stream (without child streams).
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                renaming-a-stream:
                  value:
                    stream:
                      name: Slothing
                      modified: 1735689600
                      modifiedBy: c000000000000000000000001
                      id: sport
                      parentId: null
                      created: 1672575696
                      createdBy: c000000000000000000000000
        "409":
          description: |-
            Specific errors:

            - `item-already-exists`: A similar stream already exists. The error's `data` contains the conflicting properties.
          x-pryv-error-ids:
            - item-already-exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
    delete:
      operationId: streams.delete
      summary: Delete stream
      tags:
        - Streams
      x-pryv-method-ids:
        - streams.delete
      description: |-
        Trashes or deletes the specified stream, depending on its current state:

        - If the stream is not already in the trash, it will be moved to the trash (i.e. flagged as `trashed`)
        - If the stream is already in the trash, it will be irreversibly deleted with its descendants (if any). If events exist that refer to the deleted item(s), you must indicate how to handle them with the parameter `mergeEventsWithParent`.

        Since the deletion removes the whole subtree, an access other than a personal one needs a `manage` permission on every stream of the subtree (the stream and all its descendants), not only on the stream itself; with `mergeEventsWithParent=true` it also needs the right to create events on the parent stream, which receives them (`create-only`, `contribute` or `manage`). Otherwise the call answers `403 forbidden` and nothing is deleted.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            allOf:
              - $ref: "#/components/schemas/identifier"
          description: The id of the stream.
        - in: query
          name: mergeEventsWithParent
          required: true
          schema:
            type: boolean
          description: Required if actually deleting the item and if it (or any of its descendants) has linked events, ignored otherwise. If `true`, the linked events will be assigned to the parent of the deleted item; if `false`, the linked events will be deleted.
      responses:
        "200":
          description: |-
            Result: trashed

            Or: Result: deleted
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      stream:
                        allOf:
                          - $ref: "#/components/schemas/stream"
                        description: The trashed stream.
                      meta:
                        $ref: "#/components/schemas/meta"
                  - type: object
                    properties:
                      streamDeletion:
                        allOf:
                          - $ref: "#/components/schemas/item-deletion"
                        description: The stream deletion record.
                      meta:
                        $ref: "#/components/schemas/meta"
              examples:
                trashing:
                  value:
                    stream:
                      trashed: true
                      modified: 1735689600
                      modifiedBy: c000000000000000000000001
                      id: weight
                      name: Weight
                      parentId: health
                      children: []
                      created: 1672575714.7532644
                      createdBy: c000000000000000000000000
                deleting:
                  value:
                    streamDeletion:
                      id: weight
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /accesses:
    get:
      operationId: accesses.get
      summary: Get accesses
      tags:
        - Accesses
      x-pryv-method-ids:
        - accesses.get
      description: |-
        Gets accesses that were created by your access token, unless you're using a personal token then it returns all accesses.
        Only returns accesses that are active when making the request. To include accesses that have expired or were deleted, use
        the `includeExpired` or `includeDeletions` parameters respectively.

        A delegated personal access ([account delegation](https://pryv.github.io/guides/account-delegation/#credentials-of-the-accounts-other-accesses)) also lists all accesses, but receives `token` and `apiEndpoint` only for itself and for the accesses it created; the other accesses are returned without them.

        In v2 the returned `id`, `createdBy`, and `modifiedBy` fields use the composite reference format `<base>:<serial>` for accesses that have been updated at least once. Never-updated accesses still serialise as bare cuid (`<base>`) for full backwards-compatibility. Parse with `pryv.utils.parseAccessRef(ref)` if you need to extract the version.
      parameters:
        - in: query
          name: includeExpired
          required: false
          schema:
            type: boolean
          description: If `true`, also includes expired accesses. Defaults to `false`.
        - in: query
          name: includeDeletions
          required: false
          schema:
            type: boolean
          description: If `true`, also includes deleted accesses. Defaults to `false`.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accesses:
                    type: array
                    items:
                      $ref: "#/components/schemas/access"
                    description: All manageable accesses in the user's account, ordered by name.
                  accessDeletions:
                    type: array
                    items:
                      $ref: "#/components/schemas/access"
                    description: If requested by `includeDeletions`, the access deletions, ordered by deletion time.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    accesses:
                      - id: c000000000000000000000004
                        token: c000000000000000000000005
                        type: shared
                        name: Arthur
                        permissions:
                          - streamId: family
                            level: contribute
                        integrity: ACCESS:0:sha256-PHrsNNRauGOQV7YUeCo/HP21EugCbYkv/laykaWw9RE=
                        created: 1735646400
                        createdBy: c000000000000000000000001
                        modified: 1735646400
                        modifiedBy: c000000000000000000000001
                        apiEndpoint: https://c000000000000000000000005@user1.pryv.me/
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
    post:
      operationId: accesses.create
      summary: Create access
      tags:
        - Accesses
      x-pryv-method-ids:
        - accesses.create
      description: |-
        Creates a new access. You can only create accesses whose permissions are a subset of those granted to your own access token.

        **v2 behaviour change** (Pryv.io ≥ 2.0.0-pre.X): when an `app` access creates a `shared` access scoped under it, the new shared's `expires` (resolved from `expireAfter` if provided) cannot exceed the managing app's `expires`. Violations return `invalid-operation` with `data: { parentExpires, requestedExpires }`. A shared access created by an expiring `app` without `expireAfter` takes the app's `expires`, so it never outlives it. Personal-issued accesses are not subject to this check (personal accesses typically have no `expires`).

        An object with the new access's data: see [access](https://pryv.github.io/reference/#data-structure-access).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/access"
                - type: object
                  properties:
                    randomAlias:
                      type: boolean
                      description: When `true`, the access is issued a platform-unique, routable alias (`r-` followed by 8 characters) that replaces the username in the returned `apiEndpoint` and in the access-info response. The real username never appears for this access, so accesses handed to different parties cannot be cross-matched back to one account. The resolved value is returned as the access's `alias`.
            examples:
              example-1:
                value:
                  name: For colleagues
                  permissions:
                    - streamId: work
                      level: read
      responses:
        "201":
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    allOf:
                      - $ref: "#/components/schemas/access"
                    description: The created access. When `randomAlias` was set, its `alias` holds the issued alias and `apiEndpoint` is built from the alias.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    access:
                      id: c000000000000000000000006
                      token: c000000000000000000000007
                      type: shared
                      name: For colleagues
                      permissions:
                        - streamId: work
                          level: read
                      integrity: ACCESS:0:sha256-PHrsNNRauGOQV7YUeCo/HP21EugCbYkv/laykaWw9RE=
                      created: 1735689600
                      createdBy: c000000000000000000000001
                      modified: 1735689600
                      modifiedBy: c000000000000000000000001
                      apiEndpoint: https://c000000000000000000000007@user1.pryv.me/
        "400":
          description: |-
            Specific errors:

            - `invalid-item-id`: The specified token is invalid (e.g. it's a reserved word such as `null`).
          x-pryv-error-ids:
            - invalid-item-id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /accesses/{id}:
    get:
      operationId: accesses.getOne
      summary: Get one access
      tags:
        - Accesses
      x-pryv-method-ids:
        - accesses.getOne
      description: |-
        Returns the access identified by `{id}`. The id can be either:

        - **bare** `<base>`, returns the current head row.
        - **composite** `<base>:<serial>` matching the current head's serial, returns the current head row.
        - **composite** `<base>:<serial>` referring to an *older* serial, returns the historical snapshot from that version, alongside a `current` hint pointing at the live head's composite id. Mirrors GitHub's `GET /repos/X/Y/commits/<sha>` behaviour for ref-by-version.
        - any other id (unknown base, or a serial that never existed), `404 unknown-resource`.

        Pass `?includeHistory=true` to also return the full chronological history of the access (oldest first) in a `history` array. Default `false`, the singular case covers the typical "audit this access" use case without the list-side overhead.

        App callers can only fetch their own access (self) or shared accesses they directly manage; other access ids return `404 unknown-resource` to avoid info leakage.

        A delegated personal access ([account delegation](https://pryv.github.io/guides/account-delegation/#credentials-of-the-accounts-other-accesses)) receives `token` and `apiEndpoint` (in `access` and in `history`) only for itself and for the accesses it created.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            allOf:
              - $ref: "#/components/schemas/identifier"
          description: The access id to fetch. Bare cuid on never-updated accesses, composite `<base>:<serial>` once versioned.
        - in: query
          name: includeHistory
          required: false
          schema:
            type: boolean
          description: If `true`, include the chronological history of the access. Defaults to `false`.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    allOf:
                      - $ref: "#/components/schemas/access"
                    description: The requested access (current head, or historical snapshot when the id targets an older serial).
                  current:
                    type: string
                    description: Set when the request targeted an older serial, the composite id `<base>:<serial>` of the current head.
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/access"
                    description: Set when `includeHistory=true`, the chronological history of the access (oldest first). Each entry uses the composite id of the frozen version.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    access:
                      id: c000000000000000000000004
                      token: c000000000000000000000005
                      type: shared
                      name: Arthur
                      permissions:
                        - streamId: family
                          level: contribute
                      integrity: ACCESS:0:sha256-PHrsNNRauGOQV7YUeCo/HP21EugCbYkv/laykaWw9RE=
                      created: 1735646400
                      createdBy: c000000000000000000000001
                      modified: 1735646400
                      modifiedBy: c000000000000000000000001
                      apiEndpoint: https://c000000000000000000000005@user1.pryv.me/
        "404":
          description: |-
            Specific errors:

            - `unknown-resource`: The access does not exist, was soft-deleted, or the caller cannot see it (app caller visibility rule).
          x-pryv-error-ids:
            - unknown-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
    put:
      operationId: accesses.update
      summary: Update access
      tags:
        - Accesses
      x-pryv-method-ids:
        - accesses.update
      description: |-
        Updates the access identified by `{id}`. Each successful update mutates the head row, snapshots the prior state into history, and bumps the access's `serial`. The returned access carries the new wire-format composite id `<base>:<serial>` (or bare `<base>` when never updated).

        **Mutable fields** (whitelist): `name`, `deviceName`, `permissions`, `expireAfter` / `expires`, `clientData`. Anything else returns `invalid-parameters-format`.

        **Caller-vs-target matrix**:
        - `personal` accesses are immutable (no caller can update them).
        - A `personal` access can update any `app` or `shared` access.
        - An `app` access can update only the `shared` accesses it directly manages.
        - `shared` accesses cannot update anything.
        - No self-update via this method (self-revoke stays available via `accesses.delete`).

        **Chain rules enforced on update**:
        - A managed `shared`'s new `permissions` must remain a subset of its managing `app`'s permissions.
        - Narrowing an `app`'s permissions (or `expires`) is strict-rejected if any managed `shared` would now sit outside the new scope or outlive the new expiry. The error includes `data.offendingChildren: [ids]` so the caller can resolve children first and retry.
        - A managed `shared`'s `expires` cannot exceed its managing `app`'s `expires` (parent with `expires: null` imposes no cap). A managed `shared` without expiry counts as outliving any expiry: clearing a managed `shared`'s expiry (`expires: null`) under an expiring `app` is refused (`data.requestedExpires: null`), and giving an `app` an expiry while a `shared` it manages has none is refused with `data.offendingChildren`. At authentication, a `shared` without expiry is refused once its managing `app` has expired.

        **Expiry**: `expireAfter` (seconds, not negative) sets `expires` to the time of the update plus that many seconds; `expires: null` removes the expiry. `deviceName` applies to `app` accesses only, and an OAuth session access (named `oauth:<clientId>`) cannot be renamed.

        **Composite-id conflict**: the `{id}` must match the current head's `serial`. A stale composite returns `409 stale-resource` with `data: { provided, currentSerial }`; refetch the access via [Get one access](https://pryv.github.io/reference/#methods-accesses-accesses-getOne) and retry with the current head id. Bare `<base>` is only valid on a never-updated access.

        When the caller is a delegated personal access ([account delegation](https://pryv.github.io/guides/account-delegation/#credentials-of-the-accounts-other-accesses)), the returned access carries `token` and `apiEndpoint` only if the delegated access created it.

        On success, the server emits an `accessesChanged` socket.io event (coarse-grained) and an `accessUpdated` event with payload `{ type: 'access-updated', accessId, serial }` (fine-grained).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            allOf:
              - $ref: "#/components/schemas/identifier"
          description: The access id (bare or composite) to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Subset of mutable fields (`name`, `deviceName`, `permissions`, `expireAfter`, `expires: null`, `clientData`). Sent as the HTTP request body, the server wraps it into `params.update`."
            examples:
              example-1:
                value:
                  name: Renamed shared
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    allOf:
                      - $ref: "#/components/schemas/access"
                    description: The updated head, with new composite `id` and bumped `serial`.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    access:
                      id: c000000000000000000000004
                      token: c000000000000000000000005
                      type: shared
                      name: Arthur
                      permissions:
                        - streamId: family
                          level: contribute
                      integrity: ACCESS:0:sha256-PHrsNNRauGOQV7YUeCo/HP21EugCbYkv/laykaWw9RE=
                      created: 1735646400
                      createdBy: c000000000000000000000001
                      modified: 1735646400
                      modifiedBy: c000000000000000000000001
                      apiEndpoint: https://c000000000000000000000005@user1.pryv.me/
        "400":
          description: |-
            Specific errors:

            - `invalid-operation`: Chain rule violation. `data.offendingChildren` lists shared accesses that would be orphaned by a narrowing; `data.parentExpires` / `data.requestedExpires` are set for expiry-chain rejections.
          x-pryv-error-ids:
            - invalid-operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: |-
            Specific errors:

            - `forbidden`: Caller is not allowed to update the target (personal access, self-update, app-trying-to-update-a-non-managed-access, or shared caller).
          x-pryv-error-ids:
            - forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: |-
            Specific errors:

            - `unknown-resource`: Access not found or soft-deleted.
          x-pryv-error-ids:
            - unknown-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: |-
            Specific errors:

            - `stale-resource`: The provided composite `{id}` does not match the current head's serial. Refetch via `accesses.getOne` and retry.
          x-pryv-error-ids:
            - stale-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
    delete:
      operationId: accesses.delete
      summary: Delete access
      tags:
        - Accesses
      x-pryv-method-ids:
        - accesses.delete
      description: |-
        Deletes the specified access. Personal accesses can delete any access. App accesses can delete shared accesses they created. Deleting an app access deletes the shared ones it created.
        All accesses can also perform a self-delete unless a forbidden `selfRevoke` permission has been set.

        Deleting the data grant of a [cross-account messaging](https://pryv.github.io/guides/cross-account-messaging/#revoking) consent withdraws that consent, and the requester is sent `consent/revoke-cmc` (best-effort). The person's `consent/accept-cmc` event then records the withdrawal, `content.withdrawal = { at, by: 'accesses.delete', accessId }`, shortly after this call answers. Requires open-pryv.io 2.0.0-rc.36 or later for the withdrawal record.

        **v2 behaviour change** (Pryv.io ≥ 2.0.0-pre.X): the `{id}` is composite-aware, pass the composite `<base>:<serial>` you last observed via [Get accesses](https://pryv.github.io/reference/#methods-accesses-accesses-get) or [Get one access](https://pryv.github.io/reference/#methods-accesses-accesses-getOne). A stale composite returns `409 stale-resource` with `data: { provided, currentSerial }`; refetch and retry. Bare `<base>` is only valid on a never-updated access.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            allOf:
              - $ref: "#/components/schemas/identifier"
          description: The id of the access.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessDeletion:
                    allOf:
                      - $ref: "#/components/schemas/item-deletion"
                    description: The deletion record.
                  relatedDeletions:
                    type: array
                    items:
                      $ref: "#/components/schemas/item-deletion"
                    description: The deletion records of all the shared accesses that were generated from this app token when deleting it
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    accessDeletion:
                      id: c000000000000000000000001
                    relatedDeletions:
                      - id: c000000000000000000000058
                      - id: c000000000000000000000059
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /accesses/check-app:
    post:
      operationId: accesses.checkApp
      summary: Check app authorization
      tags:
        - Accesses
      x-pryv-method-ids:
        - accesses.checkApp
      description: |-
        For the app authorization process. Checks if the app requesting authorization already has access with the same permissions (and on the same device, if applicable), and returns details of the requested permissions' streams (for display) if not.

        Called with a delegated personal access ([account delegation](https://pryv.github.io/guides/account-delegation/#credentials-of-the-accounts-other-accesses)), only an app access that this delegated access created can be a `matchingAccess`; any other existing access is reported as `mismatchingAccess`, without `token` and `apiEndpoint`, so the authorization flow creates the delegate's own access.
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestingAppId:
                  type: string
                  description: The id of the app requesting authorization.
                deviceName:
                  type: string
                  description: The name of the device running the app requesting authorization, if applicable.
                requestedPermissions:
                  type: array
                  items:
                    type: object
                    description: "Described in the reference as: permission request object."
                  description: An array of permission request objects, which are identical to stream permission objects of [accesses](https://pryv.github.io/reference/#data-structure-access) except that each stream permission object must have a `defaultName` property specifying the name the stream should be created with later if missing.
              required:
                - requestingAppId
                - requestedPermissions
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkedPermissions:
                    type: array
                    items:
                      type: object
                      description: "Described in the reference as: permission request object."
                    description: |-
                      Set if no matching access already exists.
                      A updated copy of the `requestedPermissions` parameter, with the `defaultName` property of stream permissions replaced by `name` for each existing stream (set to the actual name of the item). (For missing streams the `defaultName` property is left untouched.) If streams already exist with the same name but a different `id`, `defaultName` is updated with a valid alternative proposal (in such cases the result also has an `error` property to signal the issue).
                  mismatchingAccess:
                    allOf:
                      - $ref: "#/components/schemas/access"
                    description: Set if an access already exists for the requesting app, but with different permissions than those requested.
                  matchingAccess:
                    allOf:
                      - $ref: "#/components/schemas/access"
                    description: Set if an access already exists for the requesting app with matching permissions. The existing [access](https://pryv.github.io/reference/#data-structure-access).
                  meta:
                    $ref: "#/components/schemas/meta"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /access-info:
    get:
      operationId: getAccessInfo
      summary: Access Info
      tags:
        - API methods
      x-pryv-method-ids:
        - getAccessInfo
      description: Retrieves information about the access in use.
      responses:
        "200":
          description: "The current [Access properties](https://pryv.github.io/reference/#data-structure-access), as well as:"
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    allOf:
