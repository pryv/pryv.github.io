    post:
      operationId: delegations.createAccount
      summary: Create a controlled account
      tags:
        - Account delegation
      x-pryv-method-ids:
        - delegations.createAccount
      description: Called by a delegate to create a brand-new controlled account, active from birth, with this account as its delegate. The new account has no email and no usable password unless supplied, so it is reachable only through its delegates until someone sets real credentials. On a multi-core platform the target core defaults to the delegate's own core. Requires a personal access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The username for the new controlled account. Must be available and not reserved.
                email:
                  type: string
                  description: Optional e-mail address for the new account.
                password:
                  type: string
                  description: Optional password. When omitted, the account has no usable password and is reachable only via its delegates until one is set.
                core:
                  type: string
                  description: Optional target core (its id or URL) on a multi-core platform. Defaults to the delegate's own core.
                language:
                  type: string
                  description: Optional two-letter language code for the new account.
              required:
                - username
            examples:
              example-1:
                value:
                  username: childaccount
                  language: en
      responses:
        "201":
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegation:
                    type: object
                    description: 'The active relationship to the new account: `relId`, `controlled` (`{ username, hostSlug }`), `status` (`"active"`) and `activatedAt`.'
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    delegation:
                      relId: ckz3n8x7k0000qzrmf9a1b2c3
                      controlled:
