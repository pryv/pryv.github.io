      description: |-
        Replaces the account's id in the namespace with a new one: the new id is linked, then the old one is released. Requires a personal access token. When the account holds nothing in the namespace, it behaves as [claim an external id](https://pryv.github.io/reference/#methods-account-account-externalIds.claim); when it already holds that exact value, nothing changes.

