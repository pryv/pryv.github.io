      description: |-
        Gets the attached file. Accepts an arbitrary filename path suffix (ignored) for easier link readability.
        For this function using the `auth` query parameter is not accepted. You can either use the [access token](https://pryv.github.io/reference/#data-structure-access) in the `Authorization` header or provide the `readToken` as query parameter.

        Also served as `/events/{id}/{fileId}/{fileName}`.
