      tags:
        - HF events
      x-pryv-method-ids:
        - hfs.get
      description: |-
        Retrieves HF series data points from a HF event.
        Returns data in order of ascending deltaTime between "fromTime" and "toTime".
        Data is returned as input, no sampling or aggregation is performed.
      parameters:
        - in: path
