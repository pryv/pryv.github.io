      tags:
        - HF events
      x-pryv-method-ids:
        - hfs.add
      description: |-
        Adds new HF series data points to a HF event.

        The HF series data will only store one set of values for any given deltaTime. This means you can update existing data points by 'adding' new data with the original deltaTime.

        The new HF series data point(s), see [HF series](https://pryv.github.io/reference/#data-structure-high-frequency-series).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/high-frequency-series"
            examples:
              adding-new-hf-series-data-points-to-a-hf-event:
                value:
                  format: flatJSON
                  fields:
                    - deltaTime
                    - latitude
                    - longitude
                    - altitude
                  points:
                    - - 0
                      - 10.2
                      - 11.2
                      - 500
                    - - 1
                      - 10.2
                      - 11.2
                      - 510
                    - - 2
                      - 10.2
                      - 11.2
                      - 520
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The string "ok".
                  meta:
