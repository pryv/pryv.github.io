                retrieving-hf-series-data-points-from-a-hf-event:
                  value:
                    format: flatJSON
                    fields:
                      - deltaTime
                      - latitude
                      - longitude
                      - altitude
                    points:
                      - - 0
                        - 10.2
                        - 11.2
                        - 500
                      - - 1
                        - 10.2
                        - 11.2
                        - 510
                      - - 2
                        - 10.2
                        - 11.2
                        - 520
        default:
          $ref: "#/components/responses/usual-errors"
