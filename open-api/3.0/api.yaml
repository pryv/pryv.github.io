  /series/batch:
    post:
      operationId: hfs.addBatch
      summary: Add HF series batch
      tags:
        - HF events
      x-pryv-method-ids:
        - hfs.addBatch
      description: |-
        Adds data to multiple HF series (stored in multiple HF events) in a single atomic operation. This is the fastest way to append data to Pryv; it allows transferring many data points in a single request.

        For this operation to be successful, all of the following conditions must be fulfilled:

          - The access token needs write permissions to all series identified by "eventId".
          - All events referred to must be HF events (type starts with the string "series:").
          - Fields identified in each individual message must match those specified by the type of the HF event; there must be no duplicates.
          - All the values in every data point must conform to the type specification.

        If any part of the batch message is invalid, the entire batch is aborted and the returned result body identifies the error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  description: The format string "seriesBatch".
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      eventId:
                        type: string
                        description: The id of the HF event.
                      data:
                        type: object
                        description: HF series data to add to the HF event.
                    required:
                      - eventId
                      - data
                  description: "Array of batch entries. Each batch entry is defined as follows:"
              required:
                - format
                - data
            examples:
              adding-a-batch-of-hf-series-data-to-multiple-hf-:
                value:
                  format: seriesBatch
                  data:
                    - eventId: c000000000000000000000042
                      data:
                        format: flatJSON
                        fields:
                          - deltaTime
                          - value
                        points:
                          - - 0
                            - 70
                          - - 1
                            - 71
                          - - 2
                            - 72
                    - eventId: c000000000000000000000043
                      data:
                        format: flatJSON
                        fields:
                          - deltaTime
                          - latitude
                          - longitude
                          - altitude
                        points:
                          - - 0
                            - 10.2
                            - 11.2
                            - 500
                          - - 2
                            - 10.2
                            - 11.2
                            - 510
                          - - 1
                            - 10.2
                            - 11.2
                            - 520
      responses:
        "201":
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The string "ok".
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                adding-a-batch-of-hf-series-data-to-multiple-hf-:
                  value:
                    status: ok
        "400":
          description: |-
            Specific errors:

            - `invalid-request-structure`: The request was malformed and could not be executed. The entire operation was aborted.
          x-pryv-error-ids:
            - invalid-request-structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
