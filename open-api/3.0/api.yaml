openapi: 3.0.3
info:
  title: Pryv.io API
  version: 2.0.0-pre
  description: |-
    The Pryv.io API: the methods an app calls on a user account.

    Generated from the [API reference](https://pryv.github.io/reference/) at every documentation build: do not edit by hand. The reference is the authoritative description; report differences at https://github.com/pryv/open-pryv.io/issues.

    Authorization: send the access token in the `Authorization` header (preferred) or as the `auth` query parameter. A third form, the token as basic-auth user in the URL (`https://{token}@{username}.{domain}/`), cannot be expressed in OpenAPI.
  contact:
    url: https://github.com/pryv/open-pryv.io/issues
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
x-generated-from:
  referenceVersion: 2.0.0-pre
  commit: 92c796a
servers:
  - url: https://{username}.{domain}
    description: Account endpoint, DNS form
    variables:
      username:
        default: username
      domain:
        default: pryv.me
  - url: https://{host}/{username}
    description: Account endpoint, single-host (DNS-less) form
    variables:
      host:
        default: host.your-domain.io
      username:
        default: username
tags:
  - name: Basics
  - name: Authentication
  - name: Multi-factor authentication
  - name: API methods
  - name: Events
  - name: HF events
  - name: Streams
  - name: Accesses
  - name: Webhooks
  - name: Shared secrets
  - name: Profile sets
  - name: Account management
  - name: Account delegation
paths:
  /service/info:
    get:
      operationId: service-info
      summary: Service info
      tags:
        - Basics
      x-pryv-method-ids:
        - service-info
      description: |-
        Service information provides a unified way for third party services to access the necessary information related to a Pryv.io platform as this route is served by any Pryv.io API endpoint.

        For many applications, the first step is to authenticate a user. For this you need to know the path to **access** which is usually set to `https://access.{domain}/` or `https://{hostname}/access/`.
        Fetching the path `/service/info` on any valid URL endpoint will return you a list of useful informations, such as **access**, containing the URL to access.

        See [Auto-Configuration](https://pryv.github.io/guides/app-guidelines/#auto-configuration) in the guide *App Guidelines*.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  register:
                    type: string
                    description: The URL of the register service.
                  access:
                    type: string
                    description: The URL to perform [authentication requests](https://pryv.github.io/reference/#auth-request).
                  api:
                    type: string
                    description: The API endpoint format.
                  name:
                    type: string
                    description: The platform name.
                  home:
                    type: string
                    description: The URL of the platform's home page.
                  support:
                    type: string
                    description: The email or URL of the support page.
                  terms:
                    type: string
                    description: The terms and conditions, in plain text or the URL displaying them.
                  eventTypes:
                    type: string
                    description: The URL of the list of validated event types.
                  version:
                    type: string
                    description: The API version.
                  account:
                    type: string
                    description: The root URL of the platform's account app (self-service account management, e.g. app-web-user-account), when the platform names one. The lib-js sign-in button uses it for its *Manage my account* link.
                  features:
                    type: object
                    description: "Capabilities of the platform, so clients need not probe for them. Among them: `noHF` (no high-frequency series), `contentQueries` (content queries on [events.get](https://pryv.github.io/reference/#get-events)), `mfa.methods` (active multi-factor methods), `emailVerification`, and `delegation` (`true` when [account delegation](https://pryv.github.io/guides/account-delegation/) is available: an auth page may then offer to grant an app access for an account the user controls). An absent key means an older server: treat the capability as unknown."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                retrieving-service-information:
                  value:
                    register: https://reg.pryv.me
                    access: https://access.pryv.me/access
                    api: https://{username}.pryv.me/
                    name: Pryv Lab
                    home: https://pryv.github.io
                    support: https://github.com/pryv/open-pryv.io/issues
                    terms: https://pryv.com/pryv-lab-terms-of-use/
                    eventTypes: https://pryv.github.io/event-types/flat.json
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /auth/login:
    post:
      operationId: auth.login
      summary: Login user / Login with MFA
      tags:
        - Authentication
        - Multi-factor authentication
      x-pryv-method-ids:
        - auth.login
        - mfa.login
      description: |-
        **auth.login**: Authenticates the user against the provided credentials, opening a personal access session. By default, the session is valid for 14 days after the last token usage. This duration is configurable in the platform parameters.
        This is one of the only API methods that do not expect an [auth parameter](https://pryv.github.io/reference/#basics-authorization).
        This method requires that the `appId` and `Origin` (or `Referer`) header comply with the [trusted app verification](https://pryv.github.io/reference/#basics-trusted-apps-verification).

        **mfa.login**: Proxied [Login](https://pryv.github.io/reference/#methods-auth-auth-login) call that initiates MFA authentication,
        when MFA is activated for the current user. Instead of the personal token, the result carries an `mfaToken` to complete the login with [Verify MFA challenge](https://pryv.github.io/reference/#methods-mfa-mfa-verify). For the `sms` method a code is sent to the enrolled phone for this session.

        An account enrolled in a method that is not active on the server cannot log in: the login answers `403 mfa-method-inactive` and creates no session (an operator can restore a password-only login for these accounts with `services.mfa.allowLoginWhenMethodInactive`).

        Similar to the usual [Login](https://pryv.github.io/reference/#methods-auth-auth-login) parameters.
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The user's username.
                password:
                  type: string
                  description: The user's password.
                appId:
                  type: string
                  description: Your app's unique identifier.
              required:
                - username
                - password
                - appId
            examples:
              example-1:
                value:
                  username: chuangzi
                  password: B|_|tt3rfly!
                  appId: my-app-id
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiEndpoint:
                    type: string
                    description: The API endpoint containing the authorization token. See [app guidelines](https://pryv.github.io/guides/app-guidelines/).
                  token:
                    type: string
                    description: The personal access token to use for further API calls.
                  preferredLanguage:
                    type: string
                    description: The user's preferred language as a 2-letter ISO language code.
                  passwordExpires:
                    allOf:
                      - $ref: "#/components/schemas/timestamp"
                    description: "_If password maximum age rule is enabled_: The time the password will expire, according to platform setting `PASSWORD_AGE_MAX_DAYS`."
                  passwordCanBeChanged:
                    allOf:
                      - $ref: "#/components/schemas/timestamp"
                    description: "_If password minimum age rule is enabled_: The time after which the password can be changed, according to platform setting `PASSWORD_AGE_MIN_DAYS`. Can be in the past."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    apiEndpoint: https://c000000000000000000000002@chuangzi.pryv.me/
                    token: c000000000000000000000002
                    preferredLanguage: zh
        "302":
          description: 302 Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaToken:
                    type: string
                    description: An expiring MFA session token to be used all along the MFA flow (challenge, verification).
                  mfaMethod:
                    type: string
                    enum:
                      - totp
                      - sms
                    description: The method of the account's enrolment, so the app prompts for the right code (authenticator app or SMS).
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                login-when-mfa-is-activated:
                  value:
                    mfaToken: 215bcc40-1296-11ea-9ff7-453ff2437834
                    mfaMethod: totp
        "403":
          description: |-
            Specific errors:

            - `mfa-method-inactive`: The account is enrolled in an MFA method that is not active on this server. No session is created; the user should contact the platform operator.
          x-pryv-error-ids:
            - mfa-method-inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: `sms` method: an SMS send limit is reached (see [Trigger MFA challenge](https://pryv.github.io/reference/#methods-mfa-mfa-challenge)). Retry after `error.data.retryAfterSeconds`.
            - `too-many-requests`: The server holds too many pending MFA sessions. Retry later (`Retry-After` header).
          x-pryv-error-ids:
            - too-many-attempts
            - too-many-requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - {}
  /auth/logout:
    post:
      operationId: auth.logout
      summary: Logout user
      tags:
        - Authentication
      x-pryv-method-ids:
        - auth.logout
      description: |-
        Terminates a personal access session by invalidating its access token (the user will have to login again).
        Simply provide the Authorization token in own of [the supported ways](https://pryv.github.io/reference/#authorization), no request body is required.
      x-pryv-trusted-only: true
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value: {}
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /mfa/activate:
    post:
      operationId: mfa.activate
      summary: Activate MFA
      tags:
        - Multi-factor authentication
      x-pryv-method-ids:
        - mfa.activate
      description: |-
        Initiates the MFA activation flow for a given Pryv.io user: for `totp` the result carries the secret to add to the authenticator app, for `sms` a code is sent to the given phone. The enrolment takes effect once [confirmed](https://pryv.github.io/reference/#methods-mfa-mfa-confirm).

        Requires a personal token as [authorization](https://pryv.github.io/reference/#basics-authorization), obtained by the account's own [Login call](https://pryv.github.io/reference/#methods-auth-auth-login): a delegated personal access ([account delegation](https://pryv.github.io/guides/account-delegation/)) is refused with `403 delegation-genuine-login-required`.

        An account has at most one pending activation: a new call invalidates the `mfaToken` of the previous one. When the account already has an active enrolment, this call replaces it and requires a step-up (`password` or `code`, see [Multi-factor authentication](https://pryv.github.io/reference/#multi-factor-authentication)); if the enrolment changes in the meantime, the confirmation is refused and the activation must be started again.

        A `totp` activation takes no other parameter. An `sms` activation accepts, besides `phone`, only the keys the platform lists in `services.mfa.methods.sms.contentKeys` (for example `language`, used in the provider's message template); each value is a string, and the enrolment content (`phone` and these keys) is limited to 256 bytes. Any other key is refused.
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - totp
                    - sms
                  description: The MFA method to enrol. Defaults to the platform's default method (`services.mfa.defaultMethod`, `totp` unless configured otherwise).
                phone:
                  type: string
                  description: "`sms` method only, required: the phone number to send codes to, in E.164 format: `+` followed by the country code and number, 7 to 15 digits, the first not `0` (e.g. `+41791234567`)."
                password:
                  type: string
                  description: "Step-up, when replacing an active enrolment: the account password."
                code:
                  type: string
                  description: "Step-up, when replacing an active `totp` enrolment: a current code of the authenticator app (used once)."
            examples:
              initiating-an-authenticator-app-totp-activation:
                value:
                  method: totp
              initiating-an-sms-activation:
                value:
                  method: sms
                  phone: "+41791234567"
              replacing-an-active-enrolment-step-up-with-the-a:
                value:
                  method: totp
                  password: B|_|tt3rfly!
      responses:
        "302":
          description: 302 Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfaToken:
                    type: string
                    description: An expiring MFA session token to be used all along the MFA flow (challenge, verification).
                  method:
                    type: string
                    description: '`totp` method: `"totp"`.'
                  otpauthUri:
                    type: string
                    description: "`totp` method: the `otpauth://` URI to show as a QR code to the authenticator app."
                  secret:
                    type: string
                    description: "`totp` method: the Base32 secret, for manual entry in the authenticator app."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                initiating-an-authenticator-app-totp-activation:
                  value:
                    mfaToken: 215bcc40-1296-11ea-9ff7-453ff2437834
                    method: totp
                    otpauthUri: otpauth://totp/pryv.me%3Achuangzi?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=pryv.me&algorithm=SHA1&digits=6&period=30
                    secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                initiating-an-sms-activation:
                  value:
                    mfaToken: 215bcc40-1296-11ea-9ff7-453ff2437834
                replacing-an-active-enrolment-step-up-with-the-a:
                  value:
                    mfaToken: 215bcc40-1296-11ea-9ff7-453ff2437834
                    method: totp
                    otpauthUri: otpauth://totp/pryv.me%3Achuangzi?secret=KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU&issuer=pryv.me&algorithm=SHA1&digits=6&period=30
                    secret: KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The parameters are not accepted. `error.data.id` tells why: `invalid-mfa-content` (a missing or non-E.164 `phone`, a key that is not accepted, a value that is not a string, or content over 256 bytes), `invalid-mfa-method` (an unknown or inactive method), `step-up-required` (an active enrolment is replaced without `password` or `code`, or with both).
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: |-
            Specific errors:

            - `invalid-step-up`: The step-up `password` or `code` does not match. The attempt counts in the account's MFA backoff.
            - `forbidden`: The call does not use a personal token.
            - `delegation-genuine-login-required`: The call uses a delegated personal access: MFA changes need the account's own login.
          x-pryv-error-ids:
            - invalid-step-up
            - forbidden
            - delegation-genuine-login-required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: Too many failed second factors or step-ups for this account (the step-up is not checked until the delay runs out), or, for `sms`, an SMS send limit is reached. Retry after `error.data.retryAfterSeconds`.
            - `too-many-requests`: The server holds too many pending MFA sessions. Retry later (`Retry-After` header).
          x-pryv-error-ids:
            - too-many-attempts
            - too-many-requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /mfa/confirm:
    post:
      operationId: mfa.confirm
      summary: Confirm MFA activation
      tags:
        - Multi-factor authentication
      x-pryv-method-ids:
        - mfa.confirm
      description: |-
        Confirms the MFA activation by verifying the MFA challenge triggered by a prior [MFA activation call](https://pryv.github.io/reference/#methods-mfa-mfa-activate). On success the enrolment is saved (replacing the previous one, if any) and recovery codes are returned.

        Requires the MFA session token of the activation as [authorization](https://pryv.github.io/reference/#basics-authorization).
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: "The code shown by the authenticator app (`totp`) or received by SMS (`sms`): 4 to 10 digits. Only this parameter is used."
              required:
                - code
            examples:
              finalizing-the-mfa-activation:
                value:
                  code: "123456"
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                    description: An array of recovery codes that can be used for the [MFA recover method](https://pryv.github.io/reference/#methods-mfa-mfa-recover).
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                finalizing-the-mfa-activation:
                  value:
                    recoveryCodes:
                      - fba6e1f6-9f8f-4a0a-9c4f-8cf3458b4c55
                      - eb81be18-3168-4a44-8914-d97187df991c
                      - f7d7e863-0589-4779-8ddd-6c7e33df66af
                      - fb1d579f-2b92-42e3-82fa-8d7154c334f6
                      - 52d3f019-3712-41d3-8c13-4924c3a7a703
                      - ac9de48c-a47d-46db-b276-e045ba693672
                      - de1072aa-6ed9-46a7-962c-1f8bb88ece2e
                      - cb5277cf-af86-47c3-a03e-7cc5011314ac
                      - 16055dff-bc09-4262-b276-d70df82a9a2b
                      - 36c7dd9b-5d23-4fb9-8504-c3e04aeb62c0
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: Missing or malformed `code`, or a wrong code (`error.data.id: 'invalid-mfa-code'`).
            - `invalid-operation`: The account's enrolment changed since this activation started: start again with [Activate MFA](https://pryv.github.io/reference/#methods-mfa-mfa-activate).
          x-pryv-error-ids:
            - invalid-parameters-format
            - invalid-operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "401":
          description: |-
            Specific errors:

            - `invalid-access-token`: Invalid or expired MFA session token, a token of another account or of a login, or a session invalidated after too many wrong codes.
          x-pryv-error-ids:
            - invalid-access-token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: Too many failed second factors for this account: the attempt is delayed. Retry after the number of seconds given by the `Retry-After` header and `error.data.retryAfterSeconds`. See [MFA security notes](https://pryv.github.io/customer-resources/mfa/#authenticator-app-totp).
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /mfa/challenge:
    post:
      operationId: mfa.challenge
      summary: Trigger MFA challenge
      tags:
        - Multi-factor authentication
      x-pryv-method-ids:
        - mfa.challenge
      description: |-
        Triggers the MFA challenge again, depending on the chosen MFA method: for `sms`, sends a new code (the login and the activation already send one); for `totp`, nothing is sent (the code is on the user's device) and the result names the method.

        Requires a MFA session token as [authorization](https://pryv.github.io/reference/#basics-authorization). No request body parameter is used. A login session is refused once the account's enrolment has changed (deactivated, recovered or replaced) since the login.

        **SMS send limits.** Every SMS (login, activation, this call) is counted, with platform-set limits; by default at most one SMS every 30 seconds on one MFA session, 5 per account per hour and 10 per phone number per day. When the platform generates the code itself (`single` mode), the code is valid for 5 minutes by default and a new challenge replaces the previous code of the session.
      x-pryv-trusted-only: true
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: '"Please verify the MFA challenge."'
                  method:
                    type: string
                    description: '`totp` method: `"totp"`, so the app prompts for an authenticator code.'
                  meta:
                    $ref: "#/components/schemas/meta"
        "401":
          description: |-
            Specific errors:

            - `invalid-access-token`: Invalid or expired MFA session token, a token of another account, or a login session whose enrolment has changed since the login.
          x-pryv-error-ids:
            - invalid-access-token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: Too many failed second factors for this account, or an SMS send limit is reached: nothing is sent until the delay runs out (`Retry-After` header, `error.data.retryAfterSeconds`).
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /mfa/verify:
    post:
      operationId: mfa.verify
      summary: Verify MFA challenge
      tags:
        - Multi-factor authentication
      x-pryv-method-ids:
        - mfa.verify
      description: |-
        Verifies the second factor of a [login with MFA](https://pryv.github.io/reference/#methods-mfa-mfa-login) and completes the login.

        Requires the MFA session token of the login as [authorization](https://pryv.github.io/reference/#basics-authorization). The session is refused once the account's enrolment has changed (deactivated, recovered or replaced) since the login.
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: "The code shown by the authenticator app (`totp`, accepted once) or received by SMS (`sms`): 4 to 10 digits. Only this parameter is used."
              required:
                - code
            examples:
              verifying-the-mfa-challenge:
                value:
                  code: "123456"
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The personal access token to use for further API calls.
                  apiEndpoint:
                    type: string
                    description: The API endpoint containing the authorization token, as returned by [Login](https://pryv.github.io/reference/#methods-auth-auth-login).
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                verifying-the-mfa-challenge:
                  value:
                    token: c000000000000000000000002
                    apiEndpoint: https://c000000000000000000000002@chuangzi.pryv.me/
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: Missing or malformed `code`, or a wrong code (`error.data.id: 'invalid-mfa-code'`).
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "401":
          description: |-
            Specific errors:

            - `invalid-access-token`: Invalid or expired MFA session token, a token of another account or of an activation, a session invalidated after too many wrong codes, or a session whose enrolment has changed since the login.
          x-pryv-error-ids:
            - invalid-access-token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: Too many failed second factors for this account: the code is not checked until the delay runs out (`Retry-After` header, `error.data.retryAfterSeconds`). The delay grows with each further failure up to a cap set by the platform; it never locks the account.
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /mfa/deactivate:
    post:
      operationId: mfa.deactivate
      summary: Deactivate MFA
      tags:
        - Multi-factor authentication
      x-pryv-method-ids:
        - mfa.deactivate
      description: |-
        Deactivate MFA for a given Pryv.io user.

        Requires a personal token as [authorization](https://pryv.github.io/reference/#basics-authorization), obtained by the account's own [Login call](https://pryv.github.io/reference/#methods-auth-auth-login) (a delegated personal access is refused with `403 delegation-genuine-login-required`), and a step-up in the request body: `password` or `code` (see [Multi-factor authentication](https://pryv.github.io/reference/#multi-factor-authentication)). The step-up is required whether or not the account has an active enrolment. No other parameter is accepted.
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: The account password. Send either `password` or `code`.
                code:
                  type: string
                  description: A current code of the account's authenticator app (`totp` enrolment only; used once). Send either `password` or `code`.
            examples:
              deactivating-mfa-with-the-account-password:
                value:
                  password: B|_|tt3rfly!
              deactivating-mfa-with-a-current-authenticator-ap:
                value:
                  code: "123456"
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: '"MFA deactivated."'
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                deactivating-mfa-with-the-account-password:
                  value:
                    message: MFA deactivated.
                deactivating-mfa-with-a-current-authenticator-ap:
                  value:
                    message: MFA deactivated.
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: Neither `password` nor `code` (or both) is given (`error.data.id: 'step-up-required'`), or an unexpected parameter is sent.
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: |-
            Specific errors:

            - `invalid-step-up`: The `password` or `code` does not match. The attempt counts in the account's MFA backoff.
            - `forbidden`: The call does not use a personal token.
            - `delegation-genuine-login-required`: The call uses a delegated personal access: MFA changes need the account's own login.
          x-pryv-error-ids:
            - invalid-step-up
            - forbidden
            - delegation-genuine-login-required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: Too many failed second factors or step-ups for this account: the step-up is not checked until the delay runs out (`Retry-After` header, `error.data.retryAfterSeconds`).
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /mfa/recover:
    post:
      operationId: mfa.recover
      summary: Recover MFA
      tags:
        - Multi-factor authentication
      x-pryv-method-ids:
        - mfa.recover
      description: |-
        Deactivate MFA for a given Pryv.io user using a MFA recovery code.

        This is useful when [Deactivate MFA](https://pryv.github.io/reference/#methods-mfa-mfa-deactivate) can not be used (in case of 2nd factor loss).
        Instead, requires a MFA recovery code (obtained when [confirming the MFA activation](https://pryv.github.io/reference/#methods-mfa-mfa-confirm)), as well as the account's username and password.

        The account's `username` and `password`, as well as (no other parameter is accepted):
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recoveryCode:
                  type: string
                  description: One MFA recovery code.
              required:
                - recoveryCode
            examples:
              deactivate-mfa-using-a-recovery-code:
                value:
                  recoveryCode: fba6e1f6-9f8f-4a0a-9c4f-8cf3458b4c55
                  username: chuangzi
                  password: B|_|tt3rfly!
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: '"MFA deactivated."'
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                deactivate-mfa-using-a-recovery-code:
                  value:
                    message: MFA deactivated.
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: A missing or unexpected parameter, or an invalid recovery code.
            - `invalid-operation`: MFA is not active for this account.
          x-pryv-error-ids:
            - invalid-parameters-format
            - invalid-operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "401":
          description: |-
            Specific errors:

            - `invalid-credentials`: The username and password do not match.
          x-pryv-error-ids:
            - invalid-credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
