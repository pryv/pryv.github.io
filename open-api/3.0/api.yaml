          x-pryv-error-ids:
            - external-id-already-claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: More than 10 lookups or refused claims within one minute from this client address on this core. Retry after the `Retry-After` header (seconds).
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
