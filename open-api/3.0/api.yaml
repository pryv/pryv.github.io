                  externalIds:
                    type: array
                    items:
                      $ref: "#/components/schemas/external-id"
                    description: The account's ids, sorted by namespace. Empty when the account holds none.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    externalIds:
                      - namespace: clinic-ehr
                        claimedAt: 1735516800
        "403":
          description: |-
            Specific errors:

            - `forbidden`: The request was not made with a personal access token.
          x-pryv-error-ids:
            - forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
