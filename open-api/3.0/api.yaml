        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: fileId
          required: true
          schema:
            type: string
        - in: query
          name: readToken
          required: true
          schema:
            type: string
          description: Required if not using the `Authorization` HTTP header. The file read token to authentify the request. See [`event.attachments[].readToken`](https://pryv.github.io/reference/#data-structure-event) for more info.
      responses:
        "200":
          description: |-
            The file's content, with a **Digest** header with SHA-256 hash of the file, encoded in base64, `SHA-256=....` to check file integrity see [RFC3230](https://www.ietf.org/rfc/rfc3230.txt) and [RFC5843](https://datatracker.ietf.org/doc/html/rfc5843)

            The file is always sent with `Content-Disposition: attachment`. Since open-pryv.io 2.0.0-rc.34, a file whose content type a browser executes or renders as a document (HTML, XHTML, SVG, XML, XSL, any `+xml` type, `multipart/x-mixed-replace`, JavaScript) is also sent with `Content-Security-Policy: sandbox; default-src 'none'`: opened on the API's origin, it cannot run scripts, load resources or call the API with the viewer's session. To display such a file, fetch its content and render it in your app's own sandbox. An SVG used as an `<img src>` is not affected.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
    delete:
