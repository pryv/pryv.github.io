        - tokenQuery: []
  /delegations/delegates/{username}:
    delete:
      operationId: delegations.detachDelegate
      summary: Detach a delegate
      tags:
        - Account delegation
      x-pryv-method-ids:
        - delegations.detachDelegate
      description: "Called by a controlled account to remove a delegate `{username}`. This is the authoritative teardown: it kills the delegate's token and control access on this account, then best-effort notifies the delegate; a still-pending invite is cancelled instead. Because it removes a delegation relationship, it requires a *genuine* direct login on the controlled account: a delegate token is refused."
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: The username of the delegate to detach.
        - in: query
          name: keepAccessIds
          required: false
          schema:
            type: array
            items:
              type: string
          description: |-
            The ids of the consent grants (cross-account messaging data grants) the delegate gave for this account that the account owner keeps. Over HTTP, repeat the query parameter: `?keepAccessIds=<id>&keepAccessIds=<id>`. Nothing is kept by default.

            A kept grant becomes the account owner's own consent: its delegation lineage (`clientData.delegation`) is removed, `access-info` no longer reports a delegation, the requester is told nothing, and its accept event records `content.ownerConfirmedAt` (seconds). A grant not kept is deleted, its requester receives `consent/revoke-cmc`, and its accept event records `content.withdrawal = { at, by: 'delegation-detach', relId }` (the same server-owned record the other ways of ending a consent write, see [Revoking](https://pryv.github.io/guides/cross-account-messaging/#revoking)). The other accesses granted through the delegation are deleted whatever this list holds.
          style: form
          explode: true
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value: {}
        "400":
          description: |-
            Specific errors:

            - `delegation-invalid-keep-list`: `keepAccessIds` is not an array of ids, or one of its ids is not a consent grant given through the relationship being removed. Nothing is written; `error.data.accessId` names the first id refused.
          x-pryv-error-ids:
            - delegation-invalid-keep-list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: |-
            Specific errors:

            - `delegation-genuine-login-required`: The request used a delegate (or non-personal) token. A genuine login on the controlled account is required to remove a delegation.
          x-pryv-error-ids:
            - delegation-genuine-login-required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: |-
            Specific errors:

            - `delegation-not-found`: No delegation relationship with that delegate.
          x-pryv-error-ids:
            - delegation-not-found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
  /delegations/controlled/{username}:
    delete:
      operationId: delegations.dismissControlled
      summary: Dismiss a stale controlled entry
      tags:
        - Account delegation
      x-pryv-method-ids:
        - delegations.dismissControlled
      description: Called by a delegate to remove a `stale` controlled-account entry from its own list (local housekeeping after the relationship ended on the controlled account). This removes no authority and never touches the controlled account. Only a `stale` entry may be dismissed. Requires a personal access token.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: The username of the controlled account entry to dismiss.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value: {}
        "404":
          description: |-
            Specific errors:

            - `delegation-not-found`: No delegation relationship with that controlled account.
          x-pryv-error-ids:
            - delegation-not-found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: |-
            Specific errors:

            - `delegation-mirror-not-stale`: The relationship is still invite or active; only a stale entry can be dismissed.
          x-pryv-error-ids:
            - delegation-mirror-not-stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
components:
  schemas:
    event:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/identifier"
          description: |-
            The identifier ([collision-resistant cuid](https://usecuid.org/)) for the event. Automatically generated if not set when creating the event.

            Unique.

            Read-only (except at creation).
        streamIds:
          type: array
          items:
            $ref: "#/components/schemas/identifier"
          description: The ids of the belonging streams.
        streamId:
          allOf:
            - $ref: "#/components/schemas/identifier"
          description: |-
            **(DEPRECATED)** Please use streamIds instead.

            The id of the first element of the streamIds array.
        time:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          description: The event's time. For period events, this is the time the event started. Automatically set to the server time if not provided when creating the event.
        duration:
          type: number
          nullable: true
          description: If present and non-zero, indicates that the event is a period event. **Running period events have a duration set to `null`**. **A duration set to zero is equivalent to no duration**.
        type:
          type: string
          description: The type of the event. See the [event type directory](https://pryv.github.io/event-types/#directory) for a list of standard types.
        content:
          description: The `type`-specific content of the event, if any.
        tags:
          type: array
          items:
            type: string
          description: |-
            **(DEPRECATED)** Please use streamIds instead.

            The tags associated with the event.

            Optional (always present in read items).
        description:
          type: string
          description: User description or comment for the event.
        attachments:
          type: array
          items:
            type: object
            description: "Described in the reference as: attachment object."
            properties:
              id:
                allOf:
                  - $ref: "#/components/schemas/identifier"
                description: The file's id. The attached file's URL is obtained by appending this id to the event's resource URL.
              fileName:
                type: string
                description: The file's name as uploaded.
              type:
                type: string
                description: The MIME type of the file.
              size:
                type: number
                description: The size of the file, in bytes.
              readToken:
                type: string
                description: The auth token to pass in the query string when reading the file (instead of the regular `auth` parameter). The token is unique for the file and the access used to read it. This is a security measure in situations where it is impractical to use the `Authorization` HTTP header and/or where the file's URL is likely to be exposed. See also events method [get attachment](https://pryv.github.io/reference/#methods-events-events-getAttachment).
              integrity:
                allOf:
                  - $ref: "#/components/schemas/integrity"
                readOnly: true
                description: Integrity check for attachment object.
          readOnly: true
          description: "An array describing the files attached to the event. Each item has the following structure:"
        clientData:
          allOf:
            - $ref: "#/components/schemas/key-value"
          description: Additional client data for the event.
        trashed:
          type: boolean
          description: "`true` if the event is in the trash."
        integrity:
          allOf:
            - $ref: "#/components/schemas/integrity"
          readOnly: true
          description: Integrity check for event object.
        created:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the event was created.
        createdBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the access used to create the event. Reads `system` for an event the server writes itself on the user's behalf (consent inbox copies and scope-update records, account email records, delegation records). Such events carry `created`, `modified` and `modifiedBy` like any other, so `events.get` with `modifiedSince` returns them. Since open-pryv.io 2.0.0-rc.48; events of this kind written by an earlier version get these fields when the operator runs the one-time repair.
        modified:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the event was last modified.
        modifiedBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the last access used to modify the event. Reads `system` when the server itself made the last change (for example a consent request or trigger status, a consent withdrawal or a delegation record); the change also sets `modified`, so a `modifiedSince` sync returns the event. Since open-pryv.io 2.0.0-rc.48.
      title: Event
      description: "See also: [core concepts](https://pryv.github.io/concepts/#events)."
    stream:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/identifier"
          description: |-
            The identifier for the stream. Automatically generated if not set when creating the stream; **slugified if necessary**.

            Unique.

            Read-only (except at creation).
        name:
          type: string
          description: |-
            A name identifying the stream for users. The name must be unique among the stream's siblings in the streams tree structure.

            Unique among siblings.
        parentId:
          type: string
          nullable: true
          description: The identifier of the stream's parent, if any. A value of `null` indicates that the stream has no parent (i.e. root stream).
        clientData:
          allOf:
            - $ref: "#/components/schemas/key-value"
          description: Additional client data for the stream.
        children:
          type: array
          items:
            $ref: "#/components/schemas/stream"
          readOnly: true
          description: "The stream's sub-streams, if any. This field cannot be set in requests creating a new streams: streams are created individually by design."
        trashed:
          type: boolean
          description: "`true` if the stream is in the trash."
        created:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the stream was created.
        createdBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the access used to create the stream.
        modified:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the stream was last modified.
        modifiedBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the last access used to modify the stream.
      title: Stream
      description: "See also: [core concepts](https://pryv.github.io/concepts/#streams)."
    access:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: |-
            The identifier for the access.

            Unique.
        token:
          type: string
          description: |-
            The token identifying the access. Automatically generated if not set when creating the access; **slugified if necessary**.

            Unique.

            Read-only (except at creation).
        apiEndpoint:
          type: string
          readOnly: true
          description: The API endpoint with the access' authorization token. See [app guidelines](https://pryv.github.io/guides/app-guidelines/). When the access has an `alias`, the endpoint is built from the alias instead of the username.
        alias:
          type: string
          readOnly: true
          description: "A platform-unique, routable de-identifying name (`r-` followed by 8 characters) substituted for the username in this access's `apiEndpoint` and in the access-info response. Set by passing `randomAlias: true` when creating the access; released when the access is deleted."
        type:
          type: string
          enum:
            - personal
            - app
            - shared
          description: |-
            The type — or usage — of the access. Default: `shared`.

            Read-only (except at creation).
        name:
          type: string
          description: |-
            The name identifying the access for the user. (For personal and app access, the name is used as a technical identifier and not shown as-is to the user.)

            Can be changed with [update access](https://pryv.github.io/reference/#methods-accesses-accesses-update), except on an OAuth session access (named `oauth:<clientId>`).

            Unique per type and device.
        deviceName:
          type: string
          description: |-
            For app accesses only. The name of the client device running the app, if applicable. Can be changed with [update access](https://pryv.github.io/reference/#methods-accesses-accesses-update).

            Unique per type and name.
        permissions:
          type: array
          items:
            type: object
            description: "Described in the reference as: permission object."
            properties:
              streamId:
                anyOf:
                  - $ref: "#/components/schemas/identifier"
                  - type: string
                description: |-
                  To be used with `level` property only.
                  The id of the stream or the tag the permission applies to, or `*` for all streams/tags. Stream permissions are recursively applied to child streams.
              tag:
                anyOf:
                  - $ref: "#/components/schemas/identifier"
                  - type: string
                description: |-
                  To be used with `level` property only.
                  The id of the stream or the tag the permission applies to, or `*` for all streams/tags. Stream permissions are recursively applied to child streams.
              level:
                type: string
                enum:
                  - read
                  - contribute
                  - manage
                  - create-only
                description: |-
                  Used only with `streamId` or `tag` permissions.
                  The level of access to the stream. With `contribute`, one can see and manipulate events for the stream/tag (and child streams for stream permissions); with `manage`, one can in addition create, modify and delete child streams.

                  The `create-only` level - only available for stream-based permissions - allows to read the stream and create events on it and its children.
              feature:
                type: string
                enum:
                  - selfRevoke
                  - secretSharing
                  - webhooks
                description: |-
                  To be used only with `setting` property.
                  - `selfRevoke`: with `forbidden`, the access cannot call `accesses.delete {id}` on itself (self revocation).
                  - `secretSharing`: with `forbidden`, the access cannot create one-time shared secrets.
                  - `webhooks`: with `forbidden`, the access cannot create, update or test webhooks, and the webhooks it owns do not fire.

                  An access carrying `secretSharing` or `webhooks` as `forbidden` passes the entry on to every access it creates; asking for `allowed` on such a child is refused.
              setting:
                type: string
                enum:
                  - forbidden
                  - allowed
                description: |-
                  To be used only with `feature` permission.
                  `forbidden` restricts the access as described for each feature. `allowed` is the default and the explicit form of it.
          description: 'Ignored for personal accesses. If permission levels conflict (e.g. stream set to "manage" and child stream set to "contribute"), the child stream level applies. Can be changed with [update access](https://pryv.github.io/reference/#methods-accesses-accesses-update), within the chain rules it enforces. Each permission object has the following structure:'
        lastUsed:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the access was last used.
        expireAfter:
          type: number
          description: |-
            If set, controls access expiry in seconds.
            When given a number in this attribute (positive or zero), the access will expire (and not be usable anymore) after this many seconds.
            [Update access](https://pryv.github.io/reference/#methods-accesses-accesses-update) also accepts it and sets `expires` to the time of the update plus this many seconds.
        expires:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          description: |-
            If the access was set to expire: The timestamp after which the access
            will be deactivated.
            It is computed from `expireAfter`; [update access](https://pryv.github.io/reference/#methods-accesses-accesses-update) accepts only `null` here, which removes the expiry.
        deleted:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: "If the access has been deleted: The timestamp of the deletion."
        clientData:
          allOf:
            - $ref: "#/components/schemas/key-value"
          description: |-
            Additional client data for the access. It can be set at creation and changed later with [update access](https://pryv.github.io/reference/#methods-accesses-accesses-update), for the accesses that method lets the caller update. An update merges the given keys into the stored ones as described in [key-value](https://pryv.github.io/reference/#data-structure-key-value) (a key set to `null` is removed), and `clientData: null` removes all keys.

            The `dpop` key is reserved for the sender-constrained (DPoP) key binding that the OAuth token endpoint writes: a create request that supplies it is refused, and an update that would add, change or remove it (including `clientData: null` on a bound access) is refused.

            The `delegation` key is reserved: the server sets it on the accesses [account delegation](https://pryv.github.io/guides/account-delegation/) manages and on the accesses granted through a delegation, a request that supplies it is refused, and it is kept when the rest of `clientData` is updated.
        integrity:
          allOf:
            - $ref: "#/components/schemas/integrity"
          readOnly: true
          description: Integrity check for access object.
        created:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the access was created.
        createdBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the access used to create the access.
        modified:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the access was last modified.
        modifiedBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the last access used to modify the access.
      title: Access
      description: "See also: [core concepts](https://pryv.github.io/concepts/#accesses)."
    account:
      type: object
      properties:
        username:
          type: string
          readOnly: true
          description: |-
            The user's username.

            Unique.
        email:
          type: string
          description: |-
            The user's contact e-mail address.

            Unique.
        language:
          type: string
          description: The user's preferred language as a 2-letter ISO language code.
        storageUsed:
          type: object
          properties:
            dbDocuments:
              type: number
              description: Bytes used by documents (records) in the database.
            attachedFiles:
              type: number
              description: Bytes used by attached files.
          description: The current storage size used by the user account.
      title: Account information
      description: User account information.
    external-id:
      type: object
      properties:
        namespace:
          type: string
          readOnly: true
          description: "The namespace of the id: 2 to 63 characters, lower-case letters, digits and `-`, starting with a letter or a digit."
        claimedAt:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the account claimed the id.
      title: External id
      description: "A third-party record id (an EHR patient id, for example) linked to the account, in a namespace registered by the platform administrator. An account holds at most one id per namespace, and an id belongs to at most one account on the whole platform. The id itself is never stored or returned: the platform only receives a blinded value computed by the caller, and returns only the namespace and the claim date. See the [External ids guide](https://pryv.github.io/customer-resources/external-ids/)."
    high-frequency-series:
      type: object
      properties:
        format:
          type: string
          description: The data format (for now only "flatJSON" format is supported).
        fields:
          type: array
          items:
            description: "Described in the reference as: field."
          description: |-
            The "fields" array lists all the fields that you will be providing in the "points" array, including the "deltaTime" field in first position.
            If the data type contains a single field (ex.: mass/kg), the second field is "value", otherwise, it is the list of fields with the required ones first.
        points:
          type: array
          items:
            description: "Described in the reference as: data point."
          description: |-
            The "points" array contains the data points, each data point is represented by a simple array.
            This makes the bulk of the message (your data points) very space-efficient; values are encoded positionally.
            The first value corresponds to the first field, and so on.
      title: HF series
      description: |-
        High-frequency series are collections of homogenous data points.

        To store a HF series in Pryv.io, you must first [create a HF event](https://pryv.github.io/reference/#create-hf-event).

        Series data is encoded in the "flatJSON" format:
        - Each data point in a series has a `"deltaTime"` field that indicates its time difference, since the holder event's [timestamp](https://pryv.github.io/reference/#data-structure-timestamp).
          If a `"timestamp"` field is instead provided, the corresponding `"deltaTime"` will be automatically computed from the holder event's timestamp.
        - For [types](https://pryv.github.io/event-types/#directory) that store a single value (e.g. "mass/kg"), a single additional field named `"value"` is created.
        - Types that contain multiple properties (e.g. "position/wgs84") will have many fields, whose names can be inferred from the [type reference](https://pryv.github.io/event-types/#position).
        - Optional fields can either be provided or not; omitted values will be set as null.
    webhook:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The identifier of the Webhook.
        accessId:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The identifier of the access that was used to create the Webhook.
        url:
          type: string
          description: |-
            The URL where the HTTP POST requests will be made. To identify the source of the webhook on your notifications server, you can use the `url`'s hostname, path or query parameters. For example:

            ```json
            {
              "url": "https://${username}.my-notifications.com/${my-secret}/?param1=value1&param2=value2"
            }
            ```

            The URL must use `https` or `http`, carry no credentials (`user:password@`) and be at most 2048 characters long. At each call, the host is resolved and the call is not made when an address is not public: loopback, private networks, carrier-grade NAT, link-local (including cloud metadata services), unique-local or link-local IPv6, unspecified, multicast, broadcast or otherwise reserved. A platform can allow given hosts or ranges on its private network (`webhooks.allowedPrivateHosts`). Redirects are not followed (a `3xx` answer is a failed call), and a call without an answer within the platform's timeout (10 seconds by default, `webhooks.requestTimeoutMs`) is a failed call.

            Unique per app access.

            Read-only (except at creation).
        minIntervalMs:
          type: number
          readOnly: true
          description: The webhooks run rate is throttled by a minimum interval between HTTP calls in milliseconds, sending an array of changes that occured during this period. Its value is set by the platform admin.
        maxRetries:
          type: number
          readOnly: true
          description: In case of failure to send a request, the webhook will retry `maxRetries` times at a growing interval of time before becoming `inactive` after too many successive failures. Its value is set by the platform admin.
        currentRetries:
          type: number
          readOnly: true
          description: The number of retries iterations since the last failed HTTP call. This number is 0 if the last HTTP call was successful.
        state:
          type: string
          enum:
            - active
            - inactive
          description: The current state of the Webhook. An inactive Webhook will not make any HTTP call when changes occur. It must be activated using the [update webhook](https://pryv.github.io/reference/#methods-webhooks-webhooks-update) method. Set by the server at creation (`active`); alterable with an update.
        runCount:
          type: number
          readOnly: true
          description: The number of times the Webhook has been run, including failures.
        failCount:
          type: number
          readOnly: true
          description: The number of times the Webhook has failed HTTP calls. Failed runs are HTTP requests that received a response with a status outside of the 200-299 range (redirects are not followed), no response in time, or were not made because the destination is not accepted.
        lastRun:
          type: object
          description: |-
            Described in the reference as: Run object.

            Represents the last Webhook call, comprised of its HTTP response status and timestamp.
          properties:
            status:
              type: number
              description: The HTTP response status of the call.
            timestamp:
              allOf:
                - $ref: "#/components/schemas/timestamp"
              description: The time the call was started.
          readOnly: true
        runs:
          type: array
          items:
            type: object
            description: "Described in the reference as: Run object."
          readOnly: true
          description: Array of Run objects in inverse chronological order (newest first) which allows to monitor a webhook's health. Its length is set by the platform admin.
        scopes:
          type: object
          description: |-
            Optional map of **named scopes** that restrict the webhook to specific changes. When omitted, the webhook fires on every change in the account (default, unfiltered behaviour).

            Each entry is keyed by a name you choose and has the shape `{ kind, query }`:

            - `kind` — one of `events` (default), `streams` or `accesses`.
            - `query` — a filter shaped like the parameters of the matching read method: an [events.get](https://pryv.github.io/reference/#get-events) query for `events` (`streams`, `types`, `content`, `clientData`), a `{ streams }` query for `streams`, or an accesses filter for `accesses`.

            A scoped webhook receives notifications **only** for changes matching one of its scopes. Instead of the coarse `eventsChanged` / `streamsChanged` messages, the [data changes payload](https://pryv.github.io/reference/#with-webhooks) then carries the **matched scope keys** — so your endpoint knows *which* subscription fired without inspecting the data:

            ```json
            {
              "scopes": {
                "newReadings": { "kind": "events", "query": { "streams": ["measurements"], "types": ["mass/kg"] } },
                "structure":   { "kind": "streams", "query": { "streams": ["measurements"] } }
              }
            }
            ```

            `scopes` is alterable: include it in an [update webhook](https://pryv.github.io/reference/#methods-webhooks-webhooks-update) call to change the subscriptions of an existing webhook.
        created:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the webhook was created.
        createdBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the access used to create the webhook.
        modified:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          readOnly: true
          description: The time the webhook was last modified.
        modifiedBy:
          allOf:
            - $ref: "#/components/schemas/identifier"
          readOnly: true
          description: The id of the last access used to modify the webhook.
      title: Webhook
      description: |-
        Webhooks provide push notifications to web servers using HTTP POST requests.

        Once created, they will run, executing a HTTP POST request to the provided URL for each [data change](https://pryv.github.io/reference/#with-webhooks) in the user account.

        When the webhooks service is booted, it will send a `webhooksServiceBoot` message to all active webhooks. This allows to query the API for potentially missed notifications during its down time.

        Only the app access used to create the webhook or a personal access can retrieve and modify it. This is meant to separate the responsibilities between the actor that sets the webhooks and the one(s) that consume the data following the webhook setup.
    item-deletion:
      type: object
      properties:
        id:
          allOf:
            - $ref: "#/components/schemas/identifier"
          description: The identifier of the deleted item.
        deleted:
          allOf:
            - $ref: "#/components/schemas/timestamp"
          description: The time the item was deleted.
      title: Item deletion
      description: A record of a deleted item for sync purposes.
    key-value:
      type: object
      additionalProperties: true
      title: Key-value
      description: |-
        An object (key-value map) for client apps to store additional data about the containing item (stream, event, etc.), such as a color, a reference to an associated icon, or other app-specific metadata.

        ### Adding, updating and removing client data

        When the containing item is updated, additional data fields can be added, updated and removed as follows:

        - To add or update a field, just set its value; for example: `{"clientData": {"keyToAddOrUpdate": "value"}}`
        - To delete a field, set its value to `null`; for example: `{"clientData": {"keyToDelete": null}}`

        Fields you don't specify in the update are left untouched.

        ### Naming convention

        The convention is that each app names the keys it uses with an `{app-id}:` prefix. For example, an app with id "riki" would store its data in fields such as `"riki:key": "some value"`.
    error:
      type: object
      properties:
        id:
          type: string
          description: Identifier for the error.
        message:
          type: string
          description: A human-readable description of the error.
        data:
          description: Additional machine-readable details (specified for each error if relevant).
        subErrors:
          type: array
          items:
            $ref: "#/components/schemas/error"
          description: Lists the detailed causes of the main error, if any.
      title: Error
    streams-query:
      type: object
      title: streams query
      description: |-
        The `streams` parameter for [events.get](https://pryv.github.io/reference/#get-events) query accepts an **array** of streamIds or a **streams query** for more complex requests.

        **Syntax:**

        The streams query must have at least one `any` property, with an optional `not`:

        ```json
        { "any": ["streamA", "streamB"], "all": ["streamC"], "not": ["streamD"] }
        ```

        - **any**: any streamId must match
        - **all**: all streamIds must match
        - **not**: none of the streamIds must match

        The returned events will be those matching all of the provided criteria.

        **Example:**

        To select all the events that are in `activity` or `nutrition`, tagged in `health`, but not in `private`:

        ```json
        {
          "any": ["activity", "nutrition"],
          "all": ["health"],
          "not": ["private"]
        }
        ```

        **Format:**

        The JSON object representing the query must be sent [stringified](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify) when passed as query parameter in a `GET /events` HTTP call.
        It can be sent as-is for [batch](https://pryv.github.io/reference/#call-batch) and [socket.io](https://pryv.github.io/reference/#call-with-websockets) calls.
    content-query:
      type: object
      title: Content query
      description: |-
        The `content` and `clientData` parameters of [events.get](https://pryv.github.io/reference/#get-events) each accept an **array of conditions** on the corresponding event field. All conditions (across both parameters) must match (AND); they combine freely with the other query parameters (`streams`, `types`, time bounds, paging).

        **Condition syntax:**

        Each condition is an object with a `path` and exactly **one** operator:

        ```json
        [
          { "path": "drug.codes.atc", "in": ["G03DA04", "B01AC06"] },
          { "path": "taken", "eq": true }
        ]
        ```

        - **path**: dot-separated segments addressing a value inside the field (segments match `[a-zA-Z0-9_:-]+`, so colon-namespaced `clientData` keys are queryable), or the reserved **`$`** addressing the field's root value (for scalar content, e.g. `{"path": "$", "gte": 12}`). No array indices or wildcards.
        - **eq** / **neq**: equals / exists-and-differs (string, number or boolean; `null` is not allowed — use `exists`)
        - **in**: equals any of the listed values (array of strings, numbers or booleans)
        - **exists**: `true` — a value is present at the path; `false` — no value at the path
        - **gt**, **gte**, **lt**, **lte**: numeric comparison (non-numeric values never match)
        - **prefix**: string value starts with the given prefix (covers hierarchical code classes, e.g. ATC `"G03DA"`)

        **Matching is strict on JSON types**: `{"eq": true}` matches JSON `true` only — never `1` nor `"true"`; numbers never match numeric strings. A missing path never matches any operator (use `{"exists": false}` to select absence). Only current event versions are considered.

        **Availability and performance:**

        Content queries work on every supporting deployment without any setup (engines scan). Operators can declare frequently-queried paths in the platform-wide `storages.contentIndexes` configuration to create acceleration indexes — declaration changes are reconciled at startup and never affect results, only speed.

        Support is advertised by `features.contentQueries: true` in [service info](https://pryv.github.io/reference/#service-info); older servers reject the parameters with a `400` error. Custom data stores declare their (possibly partial) support per field and operator; the declaration is visible to clients in the `clientData` of the store's root stream under `pryv-datastore:supports`, and unsupported conditions are rejected with an `invalid-operation` error rather than returning unfiltered results.

        **Cross-references between events (convention):**

        To reference source events (e.g. events derived from a document), set outbound references under the **`related`** key of the referencing event's `clientData`, mapping each referenced event id to a free-form relation label:

        ```json
        { "clientData": { "related": { "ck...sourceEventId": "derived-from" } } }
        ```

        The reverse direction ("all events created from this one") is an ordinary content query: `[{"path": "related.ck...sourceEventId", "exists": true}]` on `clientData`. This is a documented convention, not a schema: events carry only the references their author asserted, and event integrity is unaffected.

        **Format:**

        Like the streams query, the conditions array must be sent [stringified](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify) when passed as a query parameter in a `GET /events` HTTP call, and as-is for [batch](https://pryv.github.io/reference/#call-batch) and [socket.io](https://pryv.github.io/reference/#call-with-websockets) calls.
    identifier:
      type: string
      title: Item identifier
      description: A string uniquely identifying an item for a given user. For some types of items (e.g. "structural" ones such as streams), the identifier can be optionally set by API clients; otherwise it is generated by the server. **Event ids are always [collision-resistant cuids](https://usecuid.org/).**
    timestamp:
      type: number
      title: Timestamp
      description: A positive floating-point number representing a number of seconds since any reference date and time, **independently from the time zone**. Because date and time synchronization between server time and client time is done by the client simply comparing the current server timestamp with its own, the reference date and time does not actually matter (but we do use standard Unix epoch time).
    integrity:
      type: string
      title: Integrity
      description: |-
        An integrity hash computed from the JSON object it is contained in.
        The hash is prefixed with the data structure it is computed for, as well as a representation version.
    meta:
      type: object
      properties:
        apiVersion:
          description: The version of the API in the form `{major}.{minor}.{revision}`. Mirrored in HTTP header `API-Version`.
        serverTime:
          description: The current server time as a [timestamp](https://pryv.github.io/reference/#data-structure-timestamp). Keeping track of server time is necessary to properly handle time in API calls.
        serial:
          description: The serial will change every time the core or register is updated. If you compare it with the serial of a previous response and notice a difference, you should reload the service information.
      description: Metadata included in every method result.
    error-response:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/error"
        meta:
          $ref: "#/components/schemas/meta"
      required:
        - error
  responses:
    usual-errors:
      description: |-
        Usual errors, possible on any call:

        - `invalid-request-structure` (400): The request's structure is not that expected; for example: invalid JSON syntax, unexpected multipart structure when uploading file attachments.
        - `invalid-parameters-format` (400): The request's parameters do not follow the expected format. The error's `data` contains an array of validation errors.
        - `unknown-referenced-resource` (400): One or more referenced resource(s) can't be found. The error's `data.{method-parameter-key}` (e.g. `data.streamId`) contains the unknown reference(s).
        - `invalid-access-token` (401): The access token is missing or invalid.
        - `forbidden` (403): The given access token does not grant permission for this operation. See [accesses](https://pryv.github.io/reference/#data-structure-access) for more details about accesses and permissions.
        - `unknown-resource` (404): The resource can't be found.
        - `removed-method` (410): The resource or method has been removed from the API.
        - `too-many-results` (413): The `events.get` method in batch or websocket call yielded too many results. Call the API method directly, narrow the request scope or page the request.
        - `user-account-relocated` (301): The user has relocated her account to another server. Both the `Location` header and the error's `data` contain the equivalent URL pointing to the physical server now hosting the user's account. This error can only occur between the moment the account is relocated and the moment your DNS is updated to point to the new server. So we're stretching the HTTP convention a little, in that the returned URL should not be used permanently (only until `{username}.pryv.me` points to the correct server again). It's up to you to decide whether to keep it for the duration of the session (if you use sessions), for a given time, etc.
        - `user-intervention-required` (402): The request cannot be served temporarily because the user's account has exceeded its limits. The user must log into her account and fix the issue.
        - `wrong-core` (421): **Multi-core deployments only.** The request reached a core that does not host the requested user account.
        The error's `data.coreUrl` contains the correct API endpoint for this user. Clients MUST retry the
        request directly against `coreUrl`. An HTTP redirect is not used because cross-origin redirects strip
        the `Authorization` header.
        - `external-id-already-claimed` (409): An [external id](https://pryv.github.io/customer-resources/external-ids/) cannot be linked to the account. The error's `data` contains `namespace` and `reason`: `value-taken` when another account holds the id (the error never says which), `namespace-taken` when the account already holds another id in that namespace.
        - `external-id-mismatch` (400): An [auth request](https://pryv.github.io/reference/#auth-request) in `forced` mode cannot be accepted for this account. The error's `data` contains `namespace` and `reason`: `token-invalid` when the posted token does not belong to the posted username, `not-holder` when the account does not hold the request's external id (the error never says who does). The request stays `NEED_SIGNIN`.
        - `external-id-check-unavailable` (503): The core could not check who holds the external id of a `forced` [auth request](https://pryv.github.io/reference/#auth-request) (`data.reason` says why). The request stays `NEED_SIGNIN`; retry the acceptance.
        - `external-id-namespace-in-use` (409): **Admin routes only.** An external-id namespace cannot be deleted while ids are still claimed in it. The error's `data.namespace` names it. Delete it with `force=true` to remove the namespace anyway.
      x-pryv-error-ids:
        - invalid-request-structure
        - invalid-parameters-format
        - unknown-referenced-resource
        - invalid-access-token
        - forbidden
        - unknown-resource
        - removed-method
        - too-many-results
        - user-account-relocated
        - user-intervention-required
        - wrong-core
        - external-id-already-claimed
        - external-id-mismatch
        - external-id-check-unavailable
        - external-id-namespace-in-use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
  securitySchemes:
    tokenHeader:
      type: apiKey
      in: header
      name: Authorization
      description: Access token.
    tokenQuery:
      type: apiKey
      in: query
      name: auth
      description: Access token as a query parameter.
