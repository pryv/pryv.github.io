  /events:
    get:
      operationId: events.get
      summary: Get events
      tags:
        - Events
      x-pryv-method-ids:
        - events.get
      description: Queries accessible events.
      parameters:
        - in: query
          name: fromTime
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/timestamp"
          description: The start time of the timeframe you want to retrieve events for. Default is 24 hours before `toTime` if the latter is set; otherwise it is not taken into account.
        - in: query
          name: toTime
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/timestamp"
          description: "The end time of the timeframe you want to retrieve events for. Default is the current time if `fromTime` is set. We recommend to set both `fromTime` and `toTime` (for example by choosing a very small number for `fromTime` or a large one for `toTime` if you want to retrieve all events). Note: events are considered to be within a given timeframe based on their `time` and `duration`."
        - in: query
          name: streams
          required: false
          schema:
            oneOf:
              - type: array
                items:
                  $ref: "#/components/schemas/identifier"
              - $ref: "#/components/schemas/streams-query"
          description: |-
            **Array of streamIds:** Events assigned to any of the specified streams or their children will be returned.

            or

            **[Streams query](https://pryv.github.io/reference/#data-structure-streams-query)**: Object used for filtering events by complex streamIds relations.

            By default, all accessible events are returned regardless of their stream.
        - in: query
          name: tags
          required: false
          schema:
            type: array
            items:
              type: string
          description: |-
            **(DEPRECATED)** Please use [streams query](https://pryv.github.io/reference/#data-structure-streams-query) instead.

            If set, only events assigned to any of the listed tags will be returned.
          style: form
          explode: true
        - in: query
          name: types
          required: false
          schema:
            type: array
            items:
              type: string
          description: If set, only events of any of the listed types will be returned.
          style: form
          explode: true
        - in: query
          name: content
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/content-query"
          description: If set, only events whose `content` matches all the conditions will be returned. See [content query](https://pryv.github.io/reference/#data-structure-content-query) for the condition syntax, supported operators and availability. Server support is advertised by `features.contentQueries` in [service info](https://pryv.github.io/reference/#service-info).
          style: form
          explode: true
        - in: query
          name: clientData
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/content-query"
          description: Same as `content`, applied to the events' `clientData`. Conditions from both parameters must all match.
          style: form
          explode: true
        - in: query
          name: running
          required: false
          schema:
            type: boolean
          description: If `true`, only running period events will be returned.
        - in: query
          name: sortAscending
          required: false
          schema:
            type: boolean
          description: "If `true`, events will be sorted from oldest to newest. Default: false (sort descending)."
        - in: query
          name: skip
          required: false
          schema:
            type: number
          description: The number of items to skip in the results.
        - in: query
          name: limit
          required: false
          schema:
            type: number
          description: The number of items to return in the results. A default value of 20 items is used if no other range limiting parameter is specified (`fromTime`, `toTime`).
        - in: query
          name: state
          required: false
          schema:
            type: string
            enum:
              - default
              - trashed
              - all
          description: Indicates what items to return depending on their state. By default, only items that are not in the trash are returned; `trashed` returns only items in the trash, while `all` return all items regardless of their state.
        - in: query
          name: modifiedSince
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/timestamp"
          description: If specified, only events modified since that time will be returned. Events the server writes or changes itself (`createdBy` / `modifiedBy` reading `system`, see [event](https://pryv.github.io/reference/#data-structure-event)) are returned like any other.
        - in: query
          name: includeDeletions
          required: false
          schema:
            type: boolean
          description: Whether to include event deletions since `modifiedSince` for sync purposes (only applies when `modifiedSince` is set). Defaults to `false`.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/event"
                    description: The accessible events ordered by time (see `sortAscending` above).
                  eventDeletions:
                    type: array
                    items:
                      $ref: "#/components/schemas/item-deletion"
                    description: If requested by `includeDeletions`, the event deletions since `modifiedSince`, ordered by deletion time.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                fetching-the-last-20-events-default-call:
                  value:
                    events:
                      - id: c000000000000000000000035
                        time: 1735686000
                        streamIds:
                          - diary
                        streamId: diary
                        tags: []
                        type: picture/attached
                        content: null
                        attachments:
                          - id: c000000000000000000000036
                            fileName: photo.jpg
                            type: image/jpeg
