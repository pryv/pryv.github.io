  /previews/events/{id}:
    get:
      operationId: events.getPreview
      summary: Get event preview
      tags:
        - Events
      x-pryv-method-ids:
        - events.getPreview
      description: |-
        Gets a JPEG preview of a `picture/attached` event's image, resized from its first attachment. Previews are generated on first request and cached until the event is modified. Authenticate with the [access token](https://pryv.github.io/reference/#data-structure-access) in the `Authorization` header or the `auth` query parameter; the access needs read permission on one of the event's streams.

        Previews are served by the core's previews worker (on by default). Since open-pryv.io 2.0.0-rc.36 this URL is answered on the API's public port, like every other API call; before, it was reachable only through a reverse proxy routing it to the worker.

        Also served as `/previews/events/{id}.jpg`, `/previews/events/{id}.jpeg`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            allOf:
              - $ref: "#/components/schemas/identifier"
          description: The id of the event. An optional `.jpg` or `.jpeg` suffix is accepted.
        - in: query
          name: w
          required: false
          schema:
            type: number
          description: "The desired width in pixels (alias: `width`). Rounded up to 256, 512, 768 or 1024 (the maximum); the height follows the image's aspect ratio."
        - in: query
          name: h
          required: false
          schema:
            type: number
          description: "The desired height in pixels (alias: `height`), rounded the same way. When both are set, the preview fits within them. When neither is set, the preview is 256 × 256."
      responses:
        "200":
          description: "Preview: The preview image, `Content-Type: image/jpeg`."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "204":
          description: "No preview: The event is not of type `picture/attached`."
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
