                  user:
                    allOf:
                      - $ref: "#/components/schemas/key-value"
                    description: A map of user account properties.
                  delegation:
                    type: object
                    properties:
                      isDelegatedAccess:
                        type: boolean
                        enum:
                          - true
                        description: Set for a delegate token and for an access granted through a delegation.
                      controlledUsername:
                        type: string
                        description: The controlled account (the account the access lives on).
                      delegate:
                        type: object
                        description: "The delegate the access acts for: `username`, and `hostSlug` (its core) when known."
                      grantedVia:
                        type: string
                        enum:
                          - app
                        description: Set when the access was granted through the delegation rather than being the delegate token itself. Such an access is revoked when the delegate is removed from the controlled account.
                      kind:
                        type: string
                        enum:
                          - control
                        description: Set, instead of `isDelegatedAccess`, for a control access.
                    description: |-
                      Present only when the access comes from [account delegation](https://pryv.github.io/guides/account-delegation/); absent for every other access. `user.username` stays the account the access lives on.

                      For a delegate token, and for an access granted with one (an app access an auth page created for an account the user controls, and the accesses that app creates in turn): `{ isDelegatedAccess: true, controlledUsername, delegate: { username, hostSlug } }`, plus `grantedVia: "app"` for a granted access. For a control access: `{ kind: "control", controlledUsername, delegate }`.

                      This is the authoritative answer to "is this app acting for a controlled account?": the `delegation` block of an [accepted auth request](https://pryv.github.io/reference/#poll-request) is only a display hint.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    id: c000000000000000000000010
                    token: c000000000000000000000011
                    type: app
                    name: Current access
                    deviceName: My awesome device
                    permissions:
                      - streamId: health
                        level: read
                    user:
                      username: jackslater
                    lastUsed: 1735689300
                    expires: 1735689480
                    deleted: 1735689540
                    clientData:
                      consent: My custom consent message.
                    created: 1735689480
                    createdBy: c000000000000000000000001
                    modified: 1735689480
                    modifiedBy: c000000000000000000000001
                    calls:
                      getAccessInfo: 12
                      profile:get: 5
                      events:get: 12
                      streams:get: 11
                      accesses:get: 6
                    apiEndpoint: https://c000000000000000000000011@user1.pryv.me/
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
