  /account/external-ids:
    post:
      operationId: account.externalIds.claim
      summary: Claim an external id
      tags:
        - Account management
      x-pryv-method-ids:
        - account.externalIds.claim
      description: |-
        Links a third-party record id (an EHR patient id, for example) to the account, in a namespace registered by the platform administrator. Requires a personal access token. See the [External ids guide](https://pryv.github.io/customer-resources/external-ids/).

        The caller never sends the record id. It sends a blinded value, `HMAC(K_namespace, recordId)`, computed with its own namespace key, which never reaches the platform. An id belongs to at most one account on the whole platform, and an account holds at most one id per namespace: to change it, use [replace an external id](https://pryv.github.io/reference/#methods-account-account-externalIds.replace).

        Claims are within a budget per client address (an IPv4 address, or the /64 of an IPv6 address), kept by each core and shared with the [external id lookup](https://pryv.github.io/reference-system/#get-core-holding-an-external-id): at most 10 lookups or refused claims in a one-minute window opened by the first. A refused claim (`409`) counts, a successful one does not. An address over the budget is refused before the claim runs.
      x-pryv-trusted-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                  description: The namespace of the id, as registered by the platform administrator.
                blindedValue:
                  type: string
                  description: "The blinded value of the record id: base64url without padding, 16 to 64 bytes once decoded (an HMAC-SHA-256 gives 32 bytes). Handle it like a secret: until an account claims it, holding it is what lets an account claim the id."
              required:
                - namespace
                - blindedValue
            examples:
              example-1:
                value:
                  namespace: clinic-ehr
                  blindedValue: 5axJiZtfRrrFmLoDoJc9LWUadGJBz-ByjoE8SAAHBz4
      responses:
        "200":
          description: "Result: already linked: The account already holds that exact value in the namespace: nothing changes (the call is idempotent)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  externalId:
                    allOf:
                      - $ref: "#/components/schemas/external-id"
                    description: The id the account holds, with its original claim date.
                  meta:
                    $ref: "#/components/schemas/meta"
        "201":
          description: "Result: linked now"
          content:
            application/json:
              schema:
                type: object
                properties:
                  externalId:
                    allOf:
                      - $ref: "#/components/schemas/external-id"
                    description: The id now linked to the account (namespace and claim date, never the value).
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    externalId:
                      namespace: clinic-ehr
                      claimedAt: 1735689600
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The namespace is unknown, or the blinded value is malformed. The error never echoes the value.
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: |-
            Specific errors:

            - `forbidden`: The request was not made with a personal access token (an app or a shared access is refused).
          x-pryv-error-ids:
            - forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: |-
            Specific errors:

            - `external-id-already-claimed`: The id cannot be linked; `data: { namespace, reason }`. `reason` is `value-taken` when another account, on any core, holds the id (the error never says which), or `namespace-taken` when this account already holds another id in the namespace (use replace).
          x-pryv-error-ids:
            - external-id-already-claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: More than 10 lookups or refused claims within one minute from this client address on this core. The claim is not run. Retry after the `Retry-After` header (seconds), also given as `error.data.retryAfterSeconds`.
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - tokenHeader: []
        - tokenQuery: []
