                  params:
                    oneOf:
                      - type: object
                      - type: array
                        items: {}
                    description: The call parameters as required by the method.
                required:
                  - method
                  - params
            examples:
              ensure-stream-path-for-a-new-event-in-this-examp:
                value:
                  - method: streams.create
