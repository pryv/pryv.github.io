          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: |-
            Specific errors:

            - `forbidden`: The request was not made with a personal access token.
