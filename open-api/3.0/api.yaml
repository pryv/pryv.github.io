        - Account delegation
      x-pryv-method-ids:
        - delegations.getToken
      description: Called by a delegate to obtain a delegate access token for an active controlled account `{username}`. The returned token is a personal-class token over the controlled account, and its `apiEndpoint` points at the controlled account's core so the delegate's client talks to that core directly. Re-issuing while the session is alive returns the same token. Requires a personal access token.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          description: The username of the active controlled account to get a token for.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The delegate access token (a personal-class token over the controlled account).
                  apiEndpoint:
                    type: string
                    description: The controlled account's API endpoint (token embedded), to be used directly against its core.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                example-1:
                  value:
                    token: cwyz8k2p90000356mexampletok
                    apiEndpoint: https://cwyz8k2p90000356mexampletok@childaccount.pryv.me/
        "404":
          description: |-
            Specific errors:

