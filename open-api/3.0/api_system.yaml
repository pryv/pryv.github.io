  /ext-id/cores:
    post:
      operationId: extIdCores.get
      summary: Get core holding an external id
      tags:
        - Users
      x-pryv-method-ids:
        - extIdCores.get
      description: |-
        Get the base URL of the core holding an [external id](https://pryv.github.io/customer-resources/external-ids/): the core of the one account that claimed it. It never tells which account. No authentication. On a DNS-less setup the route is `https://{hostname}/reg/ext-id/cores`.

        It is a `POST` so the blinded value never appears in a URL. An unknown namespace and an id nobody claimed give the same answer, `404 unknown-resource`.

        Every lookup counts toward a budget per client address (an IPv4 address, or the /64 of an IPv6 address), kept by each core and shared with the refused claims of [claim an external id](https://pryv.github.io/reference/#claim-an-external-id): at most 10 in a one-minute window opened by the first. Past it the lookup is refused with `429 too-many-attempts` until the window ends. The address is read through `http.trustedProxies`.
      x-pryv-server: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                  description: The namespace of the id.
                blindedValue:
                  type: string
                  description: "The blinded value of the record id, `HMAC(K_namespace, recordId)`: base64url without padding, 16 to 64 bytes once decoded."
              required:
                - namespace
                - blindedValue
            examples:
              finding-the-core-that-holds-an-external-id:
                value:
                  namespace: clinic-ehr
                  blindedValue: 5axJiZtfRrrFmLoDoJc9LWUadGJBz-ByjoE8SAAHBz4
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  server:
                    type: string
                    description: The base URL of the core holding the id.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                finding-the-core-that-holds-an-external-id:
                  value:
                    server: https://co1.pryv.me/
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The blinded value is malformed. The error never echoes the value.
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: |-
            Specific errors:

            - `unknown-resource`: The namespace is unknown, or no account holds the id.
          x-pryv-error-ids:
            - unknown-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: More than 10 lookups or refused claims within one minute from this client address on this core. The id is not looked up. Retry after the `Retry-After` header (seconds), also given as `error.data.retryAfterSeconds`.
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
