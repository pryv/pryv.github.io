      security: []
  /reg/access:
    post:
      operationId: access.create
      summary: Create access request
      tags:
        - Users
      x-pryv-method-ids:
        - access.create
      description: |-
        Creates a new access authorization request. The requesting app calls this method, then polls
        the returned URL until the user accepts or refuses the request.
        This implements the Pryv.io OAuth-like authorization flow.
      x-pryv-server: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestingAppId:
                  type: string
                  description: The id of the app requesting access.
                requestedPermissions:
                  type: array
                  items:
                    type: object
                    description: "Described in the reference as: permission object."
                  description: The permissions requested by the app.
                returnURL:
                  type: string
                  description: An optional URL to redirect the user to after accepting or refusing.
                clientData:
                  type: object
                  description: Optional metadata the requesting app wants to attach to the request.
                credentialHandoff:
                  type: string
                  description: Ask that the token be delivered through a one-time shared secret rather than returned in the poll. The only accepted value is `shared-secret`; anything else is a `400 invalid-parameters`. When the server understands it, the `ACCEPTED` poll carries a `handoff` key instead of `token` (see [Poll access request](https://pryv.github.io/reference-system/#poll-access-request)) and the 201 echoes `credentialHandoff` back. An older core drops the field and echoes nothing, so the request degrades to inline `token` delivery.
                cmcInvites:
                  type: array
                  items:
                    type: object
                    description: "Described in the reference as: invite object."
                  description: "[Cross-account messaging](https://pryv.github.io/guides/cross-account-messaging/#consent-invites-in-the-authorisation-request) invites the user should answer on the auth page, next to the app access: 1 to 8 entries `{ capabilityUrl, mandatory?, for?, accessName? }`, with no other key. `capabilityUrl` is an absolute `http` or `https` URL of at most 2048 characters; `mandatory` a boolean (default `false`); `for` `self` (default) or `target` (the account the access is granted for, when the user acts for an account they manage); `accessName` the name of the data grant minted by accepting the invite, 1 to 256 characters, stored as sent (the server does not use it; the auth page passes it to the accept). A malformed list is a `400 invalid-parameters`. The request's size ceiling (`access:maxRequestBytes`) still applies. The 201 echoes the normalised list only when the server understood it; an older core drops the field. Requires open-pryv.io 2.0.0-rc.32 or later; `accessName` requires open-pryv.io 2.0.0-rc.36 or later, and an older core refuses an entry carrying it with `400 invalid-parameters`."
                actAs:
                  type: string
                  description: "Who the access may be granted for, when the user controls other accounts through [account delegation](https://pryv.github.io/guides/account-delegation/#granting-an-app-access-for-a-controlled-account): `allow` (the default behaviour when omitted), `deny` (the signed-in account only) or a username to preselect. Any other value is a `400 invalid-parameters`."
                actAsManagedOnly:
                  type: boolean
                  description: "`true` when the access must be granted for an account the user manages, never for the signed-in account. Requires `actAs` (`allow` or a username): `true` without `actAs` or with `actAs: 'deny'`, or a value that is not a boolean, is a `400 invalid-parameters`; `false` is the same as not sending it. A hint the auth page enforces, not the server: the reference auth page lists only managed accounts and, when none can be used, refuses with `reasonId: 'MANAGED_ACCOUNT_UNAVAILABLE'`. The 201 echoes `actAsManagedOnly: true` only when the server understood it; an older core drops the field. Requires open-pryv.io 2.0.0-rc.36 or later."
              required:
                - requestingAppId
                - requestedPermissions
      responses:
        "201":
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The current status of the request (`NEED_SIGNIN`).
                  key:
                    type: string
                    description: The polling key. Use it to poll and to build the auth URL.
                  poll:
                    type: string
                    description: The full URL to poll for status updates.
                  poll_rate_ms:
                    type: number
                    description: The recommended polling interval in milliseconds.
                  credentialHandoff:
                    type: string
                    description: Echoed as `shared-secret` only when the request carried it and the server understood it. Its absence tells the app it will receive inline `token` delivery.
                  cmcInvites:
                    type: array
                    items:
                      type: object
                      description: "Described in the reference as: invite object."
                    description: Echoed, normalised (`mandatory` and `for` filled in, `accessName` only on an entry that carried it), only when the request carried `cmcInvites` and the server understood them. The `NEED_SIGNIN` poll carries the same list for the auth page.
                  actAsManagedOnly:
                    type: boolean
                    enum:
                      - true
                    description: "Echoed as `true` only when the request carried `actAsManagedOnly: true` and the server understood it. The `NEED_SIGNIN` poll carries it too, for the auth page."
                  meta:
                    $ref: "#/components/schemas/meta"
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /reg/access/{key}:
    get:
      operationId: access.poll
      summary: Poll access request
      tags:
        - Users
      x-pryv-method-ids:
        - access.poll
      description: |-
        Polls the status of a pending access request. The requesting app calls this periodically
        until it receives `ACCEPTED`, `REFUSED`, or `ERROR`.

        Possible statuses: `NEED_SIGNIN` (waiting), `ACCEPTED` (token issued), `REFUSED`, `ERROR`.
      x-pryv-server: register
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: The polling key returned by [Create access request](https://pryv.github.io/reference-system/#create-access-request).
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The current status.
                  username:
                    type: string
                    description: (When `ACCEPTED`) The username that granted the access.
                  token:
                    type: string
                    description: "(When `ACCEPTED`, inline delivery) The personal or app token. Absent when the request asked for `credentialHandoff: 'shared-secret'` and the server delivers a `handoff` instead."
                  apiEndpoint:
                    type: string
                    description: (When `ACCEPTED`) The API endpoint for subsequent requests. Token-less when a `handoff` is delivered.
                  handoff:
                    type: object
                    description: '(When `ACCEPTED` and the request asked for `credentialHandoff`) A one-time credential hand-off in place of `token`, shaped `{ "type": "shared-secret", "key": "<eventId>.<random>" }`. Retrieve the credential exactly once with `POST {apiEndpoint}shared-secrets/retrieve` (body `{ "key": "<key>" }`, unauthenticated), which returns `{ "secret": { "username", "token", "apiEndpoint" } }`; a second retrieve answers `403 shared-secret-unavailable`. See [Shared secrets](https://pryv.github.io/reference-system/#shared-secrets).'
                  cmcInvites:
                    type: array
                    items: {}
                    description: "(When `NEED_SIGNIN`) The request's normalised `cmcInvites`, with `accessName` on the entries that carried it, for the auth page. (When `ACCEPTED`) The outcome the auth page posted for each invite, in the request's order: `{ acceptEventId, dataGrantAccessId?, acceptedFor?: 'self' }`, `{ declined: true }` or `{ reason }`, carried with inline and hand-off delivery alike. The outcomes are a hint from the auth page, not verified by the server; each requester learns the truth from its own inbox. Absent when the request carried no invites or the page posted no outcomes."
                  actAsManagedOnly:
                    type: boolean
                    enum:
                      - true
                    description: (When `NEED_SIGNIN`) `true` when the request asked that the access be granted for an account the user manages only. Absent otherwise, and never on `ACCEPTED`.
                  reasonId:
                    type: string
                    description: (When `REFUSED` or `ERROR`) The reason code the auth page posted. `REFUSED_MANDATORY_CONSENT` means the user declined a mandatory invite of `cmcInvites`; `MANDATORY_CONSENT_FAILED` that a mandatory invite could not be accepted (`message` names the invite and the error id); `MANAGED_ACCOUNT_UNAVAILABLE` that the request asked for `actAsManagedOnly` and the user had no managed account to grant the access for (`message` names the cause).
                  meta:
                    $ref: "#/components/schemas/meta"
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
    post:
      operationId: access.update
      summary: Accept/Refuse access request
      tags:
        - Users
      x-pryv-method-ids:
        - access.update
      description: |-
        Updates the state of an access request. Called by the auth page after the user has
        signed in and accepted or refused the permissions.

        On a request whose `externalId` is in `forced` mode, `ACCEPTED` is checked before anything is written: the token must be an app access of `username` and that account must hold the id (see the `externalId` of the [auth request](https://pryv.github.io/reference/#auth-request)). The token is posted inline; a `handoff` or `externalIdDeclined` field is refused with `invalid-parameters` (HTTP 400). A refused acceptance leaves the request `NEED_SIGNIN`.
      x-pryv-server: register
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
          description: The polling key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: "The new status: `ACCEPTED`, `REFUSED` or `ERROR`. Any other value is refused with `invalid-parameters` (HTTP 400); `REDIRECTED` is no longer accepted since open-pryv.io 2.0.0-rc.36."
                username:
                  type: string
                  description: (Required when `ACCEPTED`) The username granting the access.
                token:
                  type: string
                  description: (Required when `ACCEPTED`) The token for the access.
                cmcInvites:
                  type: array
                  items:
                    type: object
                    description: "Described in the reference as: outcome object."
                  description: "(Only with `ACCEPTED`, only on a request that carried `cmcInvites`) One outcome per invite of the request, in its order: `{ acceptEventId, dataGrantAccessId?, acceptedFor?: 'self' }`, `{ declined: true }` or `{ reason }` (ids and reasons at most 256 characters). A list of the wrong length or shape, or one sent with another status or on a request without invites, is a `400 invalid-parameters` and the request is left unchanged. Served back as `cmcInvites` in the `ACCEPTED` bodies."
                reasonId:
                  type: string
                  description: (With `REFUSED` or `ERROR`) A reason code, stored as given. The reference auth page posts `REFUSED_MANDATORY_CONSENT` when the user declined a mandatory invite of `cmcInvites`, before it writes anything, `MANDATORY_CONSENT_FAILED` when a mandatory invite could not be accepted, with a `message` naming the invite and the platform's error id, and `MANAGED_ACCOUNT_UNAVAILABLE` when the request carried `actAsManagedOnly` and no account the user manages could be used, with a `message` naming the cause.
              required:
                - status
                - username
                - token
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: The updated status.
                  meta:
                    $ref: "#/components/schemas/meta"
        "400":
          description: |-
            Specific errors:

            - `external-id-mismatch`: (`forced` mode) The token is not an app access of `username` (`data.reason: 'token-invalid'`), or the account does not hold the id (`data.reason: 'not-holder'`, which counts in the [external id lookup](https://pryv.github.io/reference-system/#get-core-holding-an-external-id) budget).
          x-pryv-error-ids:
            - external-id-mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: (`forced` mode) The client address is over the external id budget. The request is left unchanged.
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "503":
          description: |-
            Specific errors:

            - `external-id-check-unavailable`: (`forced` mode) The holder check could not run (`data.reason` says why). Retry.
          x-pryv-error-ids:
            - external-id-check-unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /access/invitationtoken/check:
    post:
      operationId: invitationtoken.check
      summary: Check invitation token
      tags:
