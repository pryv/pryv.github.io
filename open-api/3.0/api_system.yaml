          schema:
            type: number
          description: "Number of tokens to generate (default: 1)."
        - in: query
          name: message
          required: false
          schema:
            type: string
          description: Optional description for the generated tokens.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
