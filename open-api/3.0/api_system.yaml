        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  "":
                    type: string
                    description: "Plain text: `true` if valid, `false` otherwise."
                  meta:
                    $ref: "#/components/schemas/meta"
        "429":
          description: |-
            Specific errors:

            - `too-many-attempts`: More than 10 checks within one minute from this client address (an IPv6 address counts toward its /64) on this core. The token is not checked. Retry after the `Retry-After` header (seconds), also given as `error.data.retryAfterSeconds`.
          x-pryv-error-ids:
            - too-many-attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /reg/admin/invitations:
    get:
      operationId: invitations.list
      summary: List invitation tokens
      tags:
        - Users
      x-pryv-method-ids:
        - invitations.list
      description: Lists all invitation tokens configured on the platform. Requires admin authorization.
      x-pryv-server: register
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitations:
                    type: array
                    items: {}
                    description: The list of invitation tokens.
                  meta:
                    $ref: "#/components/schemas/meta"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /reg/admin/invitations/post:
    get:
      operationId: invitations.generate
      summary: Generate invitation tokens
      tags:
        - Users
      x-pryv-method-ids:
        - invitations.generate
      description: Generates new invitation tokens. Requires admin authorization.
      x-pryv-server: register
      parameters:
        - in: query
          name: count
