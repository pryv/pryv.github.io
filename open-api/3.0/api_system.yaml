  /reg/records:
    post:
      operationId: dns.records
      summary: Update DNS records
      tags:
        - Users
      x-pryv-method-ids:
        - dns.records
      description: |-
        Admin endpoint for updating runtime DNS entries (e.g. ACME challenge records for SSL
        certificate provisioning). Records are persisted to PlatformDB and propagated to all
        cores in a multi-core deployment. Requires admin authorization.

        DNS records are answered before usernames, so a new record under the name of an
        existing account is refused with `409 item-already-exists` (an existing record can
        still be updated), and a record name cannot be registered as a username.
      x-pryv-server: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subdomain:
                  type: string
                  description: The subdomain to set records for.
                records:
                  type: object
                  description: 'The DNS records to set (e.g. `{ "TXT": "challenge-value" }`).'
              required:
                - subdomain
                - records
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subdomain:
                    type: string
                    description: The subdomain.
                  status:
                    type: string
                    description: "`ok` on success."
                  meta:
                    $ref: "#/components/schemas/meta"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
components:
  schemas:
    error:
      type: object
      properties:
        id:
          type: string
          description: Identifier for the error.
        message:
          type: string
          description: A human-readable description of the error.
        data:
          description: Additional machine-readable details (specified for each error if relevant).
        subErrors:
          type: array
          items:
            $ref: "#/components/schemas/error"
          description: Lists the detailed causes of the main error, if any.
      title: Error
    meta:
      type: object
      properties:
        apiVersion:
          description: The version of the API in the form `{major}.{minor}.{revision}`. Mirrored in HTTP header `API-Version`.
        serverTime:
          description: The current server time as a [timestamp](https://pryv.github.io/reference-system/#data-structure-timestamp). Keeping track of server time is necessary to properly handle time in API calls.
        serial:
          description: The serial will change every time the core or register is updated. If you compare it with the serial of a previous response and notice a difference, you should reload the service information.
      description: Metadata included in every method result.
    error-response:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/error"
        meta:
          $ref: "#/components/schemas/meta"
      required:
        - error
  responses:
    usual-errors:
      description: |-
        Usual errors, possible on any call:

        - `invalid-request-structure` (400): The request's structure is not that expected; for example: invalid JSON syntax, unexpected multipart structure when uploading file attachments.
        - `invalid-parameters-format` (400): The request's parameters do not follow the expected format. The error's `data` contains an array of validation errors.
        - `unknown-referenced-resource` (400): One or more referenced resource(s) can't be found. The error's `data.{method-parameter-key}` (e.g. `data.streamId`) contains the unknown reference(s).
        - `invalid-access-token` (401): The access token is missing or invalid.
        - `forbidden` (403): The given access token does not grant permission for this operation. See [accesses](https://pryv.github.io/reference-system/#data-structure-access) for more details about accesses and permissions.
        - `unknown-resource` (404): The resource can't be found.
        - `removed-method` (410): The resource or method has been removed from the API.
        - `too-many-results` (413): The `events.get` method in batch or websocket call yielded too many results. Call the API method directly, narrow the request scope or page the request.
        - `user-account-relocated` (301): The user has relocated her account to another server. Both the `Location` header and the error's `data` contain the equivalent URL pointing to the physical server now hosting the user's account. This error can only occur between the moment the account is relocated and the moment your DNS is updated to point to the new server. So we're stretching the HTTP convention a little, in that the returned URL should not be used permanently (only until `{username}.pryv.me` points to the correct server again). It's up to you to decide whether to keep it for the duration of the session (if you use sessions), for a given time, etc.
        - `user-intervention-required` (402): The request cannot be served temporarily because the user's account has exceeded its limits. The user must log into her account and fix the issue.
        - `wrong-core` (421): **Multi-core deployments only.** The request reached a core that does not host the requested user account.
        The error's `data.coreUrl` contains the correct API endpoint for this user. Clients MUST retry the
        request directly against `coreUrl`. An HTTP redirect is not used because cross-origin redirects strip
        the `Authorization` header.
        - `external-id-already-claimed` (409): An [external id](https://pryv.github.io/customer-resources/external-ids/) cannot be linked to the account. The error's `data` contains `namespace` and `reason`: `value-taken` when another account holds the id (the error never says which), `namespace-taken` when the account already holds another id in that namespace.
        - `external-id-mismatch` (400): An [auth request](https://pryv.github.io/reference-system/#auth-request) in `forced` mode cannot be accepted for this account. The error's `data` contains `namespace` and `reason`: `token-invalid` when the posted token does not belong to the posted username, `not-holder` when the account does not hold the request's external id (the error never says who does). The request stays `NEED_SIGNIN`.
        - `external-id-check-unavailable` (503): The core could not check who holds the external id of a `forced` [auth request](https://pryv.github.io/reference-system/#auth-request) (`data.reason` says why). The request stays `NEED_SIGNIN`; retry the acceptance.
        - `external-id-namespace-in-use` (409): **Admin routes only.** An external-id namespace cannot be deleted while ids are still claimed in it. The error's `data.namespace` names it. Delete it with `force=true` to remove the namespace anyway.
      x-pryv-error-ids:
        - invalid-request-structure
        - invalid-parameters-format
        - unknown-referenced-resource
        - invalid-access-token
        - forbidden
        - unknown-resource
        - removed-method
        - too-many-results
        - user-account-relocated
        - user-intervention-required
        - wrong-core
        - external-id-already-claimed
        - external-id-mismatch
        - external-id-check-unavailable
        - external-id-namespace-in-use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: Authorization
      description: Platform admin key.
