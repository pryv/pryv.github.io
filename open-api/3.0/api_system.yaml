openapi: 3.0.3
info:
  title: Pryv.io system API
  version: 2.0.0-pre
  description: |-
    The Pryv.io system API: account creation, platform services and administration calls.

    Generated from the [API reference](https://pryv.github.io/reference-system/) at every documentation build: do not edit by hand. The reference is the authoritative description; report differences at https://github.com/pryv/open-pryv.io/issues.

    Methods flagged admin-only take the platform admin key in the `Authorization` header.
  contact:
    url: https://github.com/pryv/open-pryv.io/issues
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
x-generated-from:
  referenceVersion: 2.0.0-pre
  commit: 699a192
servers:
  - url: https://reg.{domain}
    description: "Register service (methods marked x-pryv-server: register)"
    variables:
      domain:
        default: pryv.me
  - url: https://{core}.{domain}
    description: "Core server (methods marked x-pryv-server: core)"
    variables:
      core:
        default: core
      domain:
        default: pryv.me
tags:
  - name: Admin
  - name: External ids
  - name: Service
  - name: Users
paths:
  /system/admin/users:
    get:
      operationId: users.get
      summary: Get users
      tags:
        - Admin
      x-pryv-method-ids:
        - users.get
      description: Get the list of all users registered on the platform.
      x-pryv-server: core
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                    description: "One object per user: `username`, `id`, `email` and `language`, plus `core`, the URL of the core that hosts the account, on a multi-core platform."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                fetching-the-users-list-for-a-pryv-io-platform:
                  value:
                    users:
                      - username: user1
                        id: c000000000000000000000046
                        email: red.miller@mail.ch
                        language: en
                      - username: user2
                        id: c000000000000000000000047
                        email: user2@gmail.com
                        language: fr
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /admin/servers:
    get:
      operationId: servers.get
      summary: Get core servers
      tags:
        - Admin
      x-pryv-method-ids:
        - servers.get
      description: Get the list of all core servers with the number of users on them.
      x-pryv-server: register
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: object
                    description: Object mapping each available core server to its user count.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                fetching-the-core-servers-list-for-a-pryv-io-pla:
                  value:
                    servers:
                      core1.pryv.me: 1337
                      core2.pryv.me: 42
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /admin/servers/{serverName}/users:
    get:
      operationId: servers.users.get
      summary: Get users on core server
      tags:
        - Admin
      x-pryv-method-ids:
        - servers.users.get
      description: Get the list of all users registered on a specific core server.
      x-pryv-server: register
      parameters:
        - in: path
          name: serverName
          required: true
          schema:
            type: string
          description: The name of the core server.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: {}
                    description: Array of user data.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                fetching-the-users-list-for-a-specifc-core-serve:
                  value:
                    users:
                      - username: user1
                        email: red.miller@mail.ch
                        language: en
                        invitationToken: enjoy
                        referer: "null"
                        id: c000000000000000000000046
                        registeredTimestamp: "1557743399558"
                        server: core1.pryv.me
                        registeredDate: Mon, 13 May 2019 10:29:59 GMT
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /admin/servers/{srcServerName}/rename/{dstServerName}:
    get:
      operationId: servers.rename
      summary: Rename core server
      tags:
        - Admin
      x-pryv-method-ids:
        - servers.rename
      description: Rename a core server, thus reassigning the users from srcServer to dstServer.
      x-pryv-server: register
      parameters:
        - in: path
          name: srcServerName
          required: true
          schema:
            type: string
          description: The current name of the core server to rename.
        - in: path
          name: dstServerName
          required: true
          schema:
            type: string
          description: The new name of the core server.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                    description: |-
                      The count of reassigned users.
                      It can be 0 if `srcServerName` did not match any existing core server.
                  externalIds:
                    type: number
                    description: "The number of [external-id](https://pryv.github.io/reference-system/#external-ids) index rows moved to the new core name (from open-pryv.io 2.0.0-rc.60). Run the rename with the renamed core stopped: a claim it commits after the rename would still carry the old name."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                renaming-a-core-server:
                  value:
                    count: 1
                    externalIds: 0
        "400":
          description: |-
            Specific errors:

            - `INVALID_DATA`: The server name (source or destination) is invalid because of an unrecognized format.
          x-pryv-error-ids:
            - INVALID_DATA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /system/admin/ext-id-ns:
    get:
      operationId: extIdNamespaces.list
      summary: List external-id namespaces
      tags:
        - External ids
      x-pryv-method-ids:
        - extIdNamespaces.list
      description: Lists the namespaces of the platform (from open-pryv.io 2.0.0-rc.58). The salt of a namespace is never returned. Not audited (a read).
      x-pryv-server: core
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    type: array
                    items:
                      type: object
                    description: "One object per namespace, ordered by name: `namespace` (the name), `createdAt` (a [timestamp](https://pryv.github.io/reference/#data-structure-timestamp)), `label` (shown to users on the auth page) and `defaultMode` (`hint` or `forced`)."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                listing-the-namespaces:
                  value:
                    namespaces:
                      - namespace: clinic-ehr
                        createdAt: 1792800000
                        label: Clinic patient record
                        defaultMode: hint
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /system/admin/ext-id-ns/{namespace}:
    get:
      operationId: extIdNamespaces.get
      summary: Get an external-id namespace
      tags:
        - External ids
      x-pryv-method-ids:
        - extIdNamespaces.get
      description: Gets one namespace (from open-pryv.io 2.0.0-rc.58), never its salt. Not audited (a read).
      x-pryv-server: core
      parameters:
        - in: path
          name: namespace
          required: true
          schema:
            type: string
          description: The namespace name.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace:
                    type: object
                    description: "`namespace`, `createdAt`, `label` and `defaultMode`, as in the list."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                getting-a-namespace:
                  value:
                    namespace:
                      namespace: clinic-ehr
                      createdAt: 1792800000
                      label: Clinic patient record
                      defaultMode: hint
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The name does not follow the namespace name rule.
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: |-
            Specific errors:

            - `unknown-resource`: No namespace has this name.
          x-pryv-error-ids:
            - unknown-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
    put:
      operationId: extIdNamespaces.set
      summary: Create or update an external-id namespace
      tags:
        - External ids
      x-pryv-method-ids:
        - extIdNamespaces.set
      description: Creates the namespace, or updates its label or default mode (from open-pryv.io 2.0.0-rc.58). On creation the server generates the namespace's salt; it never changes afterwards and is never returned. Answers `201 Created` on creation, `200 OK` on an update. Audited, without a user.
      x-pryv-server: core
      parameters:
        - in: path
          name: namespace
          required: true
          schema:
            type: string
          description: "The namespace name: 2 to 63 characters, lowercase letters, digits and `-`, starting with a letter or a digit (`^[a-z0-9][a-z0-9-]{1,62}$`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: The name shown to users on the auth page, 1 to 80 characters. Defaults to the namespace name on creation; unchanged on an update when omitted.
                defaultMode:
                  type: string
                  enum:
                    - hint
                    - forced
                  description: The mode of an auth request or a registration that carries an id of this namespace without a `mode`. Defaults to `hint` on creation; unchanged on an update when omitted. `forced` is honoured from open-pryv.io 2.0.0-rc.59.
            examples:
              creating-a-namespace:
                value:
                  label: Clinic patient record
      responses:
        "201":
          description: 201 Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespace:
                    type: object
                    description: "The namespace after the call: `namespace`, `createdAt`, `label` and `defaultMode` (no salt). The same body comes with `200 OK` on an update."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                creating-a-namespace:
                  value:
                    namespace:
                      namespace: clinic-ehr
                      createdAt: 1792800000
                      label: Clinic patient record
                      defaultMode: hint
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The name, the label or the default mode does not follow the rules above.
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
    delete:
      operationId: extIdNamespaces.delete
      summary: Delete an external-id namespace
      tags:
        - External ids
      x-pryv-method-ids:
        - extIdNamespaces.delete
      description: "Deletes the namespace (from open-pryv.io 2.0.0-rc.58). Refused while any account holds an id of the namespace, unless `force` is set: then only the namespace row goes, and each core's reconcile (`bin/reconcile-user-cores.js --ext-ids`) reports its local ids of that namespace and keeps them. A deleted salt cannot be recovered: every id of the namespace is orphaned. Answers `204 No Content`. Audited, without a user."
      x-pryv-server: core
      parameters:
        - in: path
          name: namespace
          required: true
          schema:
            type: string
          description: The namespace name.
        - in: query
          name: force
          required: false
          schema:
            type: boolean
          description: "`true` to delete the namespace even though ids of it are held."
      responses:
        "204":
          description: 204 No Content
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The name does not follow the namespace name rule.
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: |-
            Specific errors:

            - `unknown-resource`: No namespace has this name.
          x-pryv-error-ids:
            - unknown-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: |-
            Specific errors:

            - `external-id-namespace-in-use`: Accounts hold ids of the namespace and `force` is not set.
          x-pryv-error-ids:
            - external-id-namespace-in-use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /system/admin/ext-id/release:
    post:
      operationId: extIdRelease
      summary: Release an external id claimed by the wrong account
      tags:
        - External ids
      x-pryv-method-ids:
        - extIdRelease
      description: |-
        Removes the link between an id and the account that holds it, so the right account can claim it (from open-pryv.io 2.0.0-rc.60). Send it to the core that holds the id; another core answers `307` with that core in `server` (and the `Location` header): send the call again there. The answer never names the account.

        The account that held the id gets an `account.externalIds.adminRelease` entry in its own audit trail (the namespace and the reason, never the value) and, when the platform sends mail, the `external-id-released` mail with the namespace label and the reason (setting `services.email.enabled.externalIdReleased`, template `services.email.externalIdReleasedTemplate`). The holder reads the reason as written: keep it factual and free of anyone else's data. A failed mail does not undo the release. The call itself is audited without a user. See the guide, [Releasing an id claimed by the wrong account](https://pryv.github.io/customer-resources/external-ids/#releasing-an-id-claimed-by-the-wrong-account).
      x-pryv-server: core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace:
                  type: string
                  description: The namespace of the id.
                blindedValue:
                  type: string
                  description: The blinded value of the id, computed as for a claim.
                reason:
                  type: string
                  description: Why the id is released, 1 to 500 characters, shown to the account that held it.
              required:
                - namespace
                - blindedValue
                - reason
            examples:
              releasing-an-id:
                value:
                  namespace: clinic-ehr
                  blindedValue: <blinded value>
                  reason: Claimed by the wrong account; the patient will link it again.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: boolean
                    enum:
                      - true
                    description: The id was released.
                  notified:
                    type: string
                    enum:
                      - mail
                      - audit-only
                    description: "`mail` when the mail to the account was sent, `audit-only` when only its audit trail records the release: mail not configured, the notice switched off, the account has no email address, or the send failed."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                releasing-an-id:
                  value:
                    released: true
                    notified: mail
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: A parameter is missing or malformed, or the namespace does not exist (the value is never echoed).
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: |-
            Specific errors:

            - `unknown-resource`: No account holds this id. Also when this core's index names it for an account that no longer exists here: the reconcile (`bin/reconcile-user-cores.js --ext-ids`) cleans such a row.
          x-pryv-error-ids:
            - unknown-resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        default:
          $ref: "#/components/responses/usual-errors"
      security:
        - adminKey: []
  /hostings:
    get:
      operationId: hostings.get
      summary: Get hostings
      tags:
        - Service
      x-pryv-method-ids:
        - hostings.get
      description: Get the list of all available hostings for data storage locations.
      x-pryv-server: register
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: object
                    description: |-
                      Object containing multiple regions, containing themselves multiple zones, containing themselves multiple **hostings**.
                      You need to use the `availableCore` URL as endpoint for the [Create user API method](https://pryv.github.io/reference-system/#create-user).
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                fetching-the-hostings-for-a-pryv-io-platform:
                  value:
                    regions:
                      europe:
                        name: Europe
                        localizedName:
                          fr: Europe
                        zones:
                          switzerland:
                            name: Switzerland
                            localizedName:
                              fr: Suisse
                            hostings:
                              core1:
                                url: https://my-hosting-provider.ch
                                name: Pilot core server
                                description: The single PoC core server
                                available: true
                                availableCore: https://my-core.ch
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /apps:
    get:
      operationId: apps.get
      summary: Get apps
      tags:
        - Service
      x-pryv-method-ids:
        - apps.get
      description: Retrieve the list of applications connected to the platform.
      x-pryv-server: register
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items: {}
                    description: An array listing all the applications connected to the Pryv.io platform.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                retrieving-the-list-of-applications-connected-to:
                  value:
                    apps:
                      - id: pryv-csv-importer
                        displayName: CSV Importer
                        description: Import existing data from CSV files
                        iconURL: https://pryv.github.io/static-web/apps/pryv-csv-importer/icon512.png
                        appURL: http://pryv.github.io/dev-tools/csv-importer
                        active: false
                        onboarding: false
                        category: Other
                        support:
                          - iPad
                          - iPhone
                          - Web
                        settingsPageURL: http://pryv.github.io/dev-tools/csv-importer
                      - id: ifttt-all
                        displayName: IFTTT
                        description: Connect Pryv to over 100 other products and services with Pryv Recipes on IFTTT
                        iconURL: https://pryv.github.io/static-web/apps/ifttt-all/icon512.png
                        appURL: https://ifttt.com/pryv
                        active: false
                        onboarding: false
                        category: Other
                        support:
                          - iPad
                          - iPhone
                          - Web
                        settingsPageURL: https://ifttt.com/pryv
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /apps/{appid}:
    get:
      operationId: apps.getOne
      summary: Get app
      tags:
        - Service
      x-pryv-method-ids:
        - apps.getOne
      description: Retrieve information about a given application.
      x-pryv-server: register
      parameters:
        - in: path
          name: appid
          required: true
          schema:
            type: string
          description: The id of the application to look for.
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: object
                    description: An object listing information about the given application.
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                retrieving-information-about-a-given-application:
                  value:
                    app:
                      id: pryv-csv-importer
                      displayName: CSV Importer
                      description: Import existing data from CSV files
                      iconURL: https://pryv.github.io/static-web/apps/pryv-csv-importer/icon512.png
                      appURL: http://pryv.github.io/dev-tools/csv-importer
                      active: false
                      onboarding: false
                      category: Other
                      support:
                        - iPad
                        - iPhone
                        - Web
                      settingsPageURL: http://pryv.github.io/dev-tools/csv-importer
        default:
          $ref: "#/components/responses/usual-errors"
      security: []
  /users:
    post:
      operationId: users.create
      summary: Create user
      tags:
        - Users
      x-pryv-method-ids:
        - users.create
      description: |-
        Creates a new user account. The method's parameters can be customized with the [system streams configuration](https://pryv.github.io/customer-resources/system-streams/).
        Enforces password complexity rules if enabled (set via the corresponding platform settings).

        Before Pryv.io 1.6, this route was served by the register server on `/user`
      x-pryv-server: core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                appId:
                  type: string
                  description: Your app's unique identifier.
                username:
                  type: string
                  description: The user's username.
                password:
                  type: string
                  description: The user's password.
                email:
                  type: string
                  description: The user's e-mail address, used for password retrieval.
                invitationToken:
                  type: string
                  description: |-
                    An invitation token, necessary when users registration is limited to a specific set of users.
                    Platform administrators may limit users registration by configuring a list of authorized invitation tokens.
                    If this is not the case, users registration is open to everyone and this parameter can be omitted.
                language:
                  type: string
                  description: The user's preferred language as a 2-letter ISO language code.
                referer:
                  type: string
                  description: A referer id potentially used for analytics.
                externalId:
                  type: object
                  description: "A record id of your system to link to the new account: `{ namespace, blindedValue, mode? }`, as in the `externalId` of the [auth request](https://pryv.github.io/reference/#auth-request) (see [External ids](https://pryv.github.io/customer-resources/external-ids/)). An id nobody holds is linked to the new account. An id another account holds leaves the new account unlinked in `hint` mode (send the user to sign in with the account that holds it), and refuses the registration with `409 external-id-already-claimed` in `forced` mode, before anything is reserved. A malformed value or an unknown namespace refuse the registration before anything is reserved. Requires an open-pryv.io release later than 2.0.0-rc.56, and 2.0.0-rc.59 or later for the `forced` mode (an older core refuses it with `invalid-parameters-format`)."
              required:
                - appId
                - username
                - password
                - email
            examples:
              creating-a-user:
                value:
                  appId: default
                  username: user-123-abc
                  password: ChjUzDXwaTG2qdV
                  email: joseph-brenner@pryv.me
                  invitationToken: o3in4o2
                  language: en
                  referer: hospital-A
      responses:
        "200":
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    description: A confirmation of the user's username.
                  apiEndpoint:
                    type: string
                    description: The apiEndpoint to reach this account. It includes a personal access token.
                  externalIdLinked:
                    type: boolean
                    description: "Present when the registration carried an `externalId`: `true` when the id is now linked to the new account, `false` when another account holds it or it could not be linked."
                  meta:
                    $ref: "#/components/schemas/meta"
              examples:
                creating-a-user:
                  value:
                    username: user-123-abc
                    apiEndpoint: https://{personal-token}@user-123-abc.pryv.me/
        "400":
          description: |-
            Specific errors:

            - `invalid-parameters-format`: The password does not match password complexity rules (if enabled), or the `externalId` is malformed or names an unknown namespace (`data.param` names the field, never the value).
          x-pryv-error-ids:
            - invalid-parameters-format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: |-
            Specific errors:

            - `external-id-already-claimed`: (`externalId` in `forced` mode) Another account holds the id (`data: { namespace, reason: 'value-taken' }`, never which account). Nothing is reserved: send the user to sign in with the account that holds it.
          x-pryv-error-ids:
            - external-id-already-claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
